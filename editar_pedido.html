<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Editar Pedido - Admin</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#121212">
    <script>
        if (!sessionStorage.getItem('adminLogueado')) {
            window.location.href = 'index.html';
        } else {
            document.documentElement.style.display = 'block';
        }
    </script>
    <style>
        html { display: none; }
        body { font-family: 'Poppins', sans-serif; background-color: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: white; }
        .container { background: #1e1e1e; padding: 2.5rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid #333; }
        h2 { text-align: center; color: rgb(255, 255, 255); margin-bottom: 10px; }
        .subtitle { text-align: center; color: #b0b0b0; margin-bottom: 25px; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.8rem; color: #b0b0b0; font-weight: 500; font-size: 0.9rem; }
        input[type="text"], input[type="tel"], select, input[type="file"] { width: 100%; padding: 12px 15px; border: 2px solid #333; border-radius: 10px; box-sizing: border-box; background: #2d2d2d; color: white; font-family: inherit; transition: all 0.3s; -webkit-appearance: none; }
        input:focus, select:focus { border-color: #8e44ad; background: #333; outline: none; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s; box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3); margin-top: 10px; -webkit-appearance: none; }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(142, 68, 173, 0.4); }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; display: none; }
        .alert.error { background-color: #f8d7da; color: #721c24; }
        .alert.success { background-color: #d4edda; color: #155724; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 0.9rem; }
        .file-info { font-size: 0.8rem; color: #888; margin-top: 5px; }

        /* Estilos para opciones de color */
        .color-options { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
        .color-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 2px solid #333; border-radius: 20px; cursor: pointer; transition: all 0.3s; background: #2d2d2d; }
        .color-option:hover { border-color: #888; }
        .color-option.selected { border-color: #9b59b6; background: #3a2e42; box-shadow: 0 0 10px rgba(155, 89, 182, 0.3); }
        .color-circle { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }

        /* Loader Styles */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #333; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.5s ease;
        }
        .loader-uib-container {
            --uib-size: 45px;
            --uib-color: white;
            --uib-speed: 2.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--uib-size);
            width: var(--uib-size);
        }
        .slice {
            position: relative;
            height: calc(var(--uib-size) / 6);
            width: 100%;
        }
        .slice::before, .slice::after {
            --uib-a: calc(var(--uib-speed) / -2);
            --uib-b: calc(var(--uib-speed) / -6);
            content: '';
            position: absolute;
            top: 0;
            left: calc(50% - var(--uib-size) / 12);
            height: 100%;
            width: calc(100% / 6);
            border-radius: 50%;
            background-color: var(--uib-color);
            flex-shrink: 0;
            animation: orbit var(--uib-speed) linear infinite;
            transition: background-color 0.3s ease;
        }
        .slice:nth-child(1)::after { animation-delay: var(--uib-a); }
        .slice:nth-child(2)::before { animation-delay: var(--uib-b); }
        .slice:nth-child(2)::after { animation-delay: calc(var(--uib-a) + var(--uib-b)); }
        .slice:nth-child(3)::before { animation-delay: calc(var(--uib-b) * 2); }
        .slice:nth-child(3)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 2); }
        .slice:nth-child(4)::before { animation-delay: calc(var(--uib-b) * 3); }
        .slice:nth-child(4)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 3); }
        .slice:nth-child(5)::before { animation-delay: calc(var(--uib-b) * 4); }
        .slice:nth-child(5)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 4); }
        .slice:nth-child(6)::before { animation-delay: calc(var(--uib-b) * 5); }
        .slice:nth-child(6)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 5); }
        @keyframes orbit {
            0% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
            5% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.684208); opacity: 0.58; }
            10% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.631576); opacity: 0.51; }
            15% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.578944); opacity: 0.44; }
            20% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.526312); opacity: 0.37; }
            25% { transform: translateX(0%) scale(0.47368); opacity: 0.3; }
            30% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.526312); opacity: 0.37; }
            35% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.578944); opacity: 0.44; }
            40% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.631576); opacity: 0.51; }
            45% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.684208); opacity: 0.58; }
            50% { transform: translateX(calc(var(--uib-size) * -0.25)) scale(0.73684); opacity: 0.65; }
            55% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.789472); opacity: 0.72; }
            60% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.842104); opacity: 0.79; }
            65% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.894736); opacity: 0.86; }
            70% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.947368); opacity: 0.93; }
            75% { transform: translateX(0%) scale(1); opacity: 1; }
            80% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.947368); opacity: 0.93; }
            85% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.894736); opacity: 0.86; }
            90% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.842104); opacity: 0.79; }
            95% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.789472); opacity: 0.72; }
            100% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
        }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-uib-container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
    <h3 style="margin: 20px 20px 0; text-align: center;">Estamos preparando ¡LA MEJOR EXPERIENCIA PARA TI!</h3>
</div>

<div class="container">
    <h2>Editar Pedido</h2>
    <p id="subtitle" class="subtitle">Cargando datos del pedido...</p>

    <div id="mensajeAlert" class="alert"></div>

    <form id="pedidoForm" style="display: none;">
        <!-- Identificador del pedido original -->
        <input type="hidden" name="original_imagen_url" id="original_imagen_url">
        <input type="hidden" name="producto_tipo" id="producto_tipo">

        <div id="dynamic-files">
            <!-- Los campos de archivo se insertarán aquí dinámicamente -->
        </div>

        <div class="form-group">
            <label for="telefono">Número Celular (Cliente):</label>
            <input type="tel" name="telefono" id="telefono" placeholder="Ej: 3001234567" required pattern="[0-9]+" disabled>
        </div>

        <button type="submit" id="btnSubmit">Actualizar Pedido</button>
    </form>
    
    <a href="admin_dashboard.html" class="back-link">← Volver al Panel de Admin</a>
</div>

<script>
    let currentPedido = null;

    window.addEventListener('load', async function() {
        const loader = document.getElementById('global-loader');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const pedidoImgUrl = urlParams.get('pedido');

        if (!pedidoImgUrl) {
            document.getElementById('subtitle').textContent = "Error: No se especificó un pedido para editar.";
            return;
        }

        try {
            const response = await fetch('pedidos.json');
            if (!response.ok) throw new Error('No se pudo cargar la base de datos.');
            const todosLosPedidos = await response.json();
            
            currentPedido = todosLosPedidos.find(p => p.imagen_url === pedidoImgUrl);

            if (!currentPedido) {
                throw new Error('Pedido no encontrado en la base de datos.');
            }

            initializeForm(currentPedido);

        } catch (error) {
            document.getElementById('subtitle').textContent = `Error: ${error.message}`;
            document.getElementById('subtitle').style.color = 'red';
        }
    });

    function getFileNameFromUrl(url) {
        if (!url) return 'Ninguno';
        try {
            return decodeURIComponent(url.split('/').pop().split('?')[0]);
        } catch (e) { return 'Desconocido'; }
    }

    function initializeForm(pedido) {
        const productoTipoCompleto = pedido.producto;
        const esMug = productoTipoCompleto.toLowerCase().includes('mug');
        const esTextil = ['camiseta', 'saco'].some(t => productoTipoCompleto.toLowerCase().includes(t));
        const esGorra = productoTipoCompleto.toLowerCase().includes('gorra');

        document.getElementById('subtitle').textContent = `Editando: ${productoTipoCompleto} de cliente ${pedido.telefono}`;
        document.getElementById('telefono').value = pedido.telefono || pedido.teléfono;
        document.getElementById('original_imagen_url').value = pedido.imagen_url;
        document.getElementById('producto_tipo').value = productoTipoCompleto;

        const dynamicFiles = document.getElementById('dynamic-files');
        dynamicFiles.innerHTML = '';

        if (esMug) {
            dynamicFiles.innerHTML = `
                <div class="form-group">
                    <label for="tipo_mug">Tipo de Mug:</label>
                    <select name="tipo_mug" id="tipo_mug" onchange="toggleColorOptions()">
                        <option value="clasico">Clásico (Blanco)</option>
                        <option value="color interno">Color Interno</option>
                    </select>
                </div>
                
                <div class="form-group" id="color_options_container" style="display:none;">
                    <label>Selecciona el Color Interno:</label>
                    <div class="color-options" id="color_options">
                        <div class="color-option" data-color="rosado" onclick="selectColor('rosado', this)"><div class="color-circle" style="background: #FF69B4;"></div>Rosado</div>
                        <div class="color-option" data-color="verde" onclick="selectColor('verde', this)"><div class="color-circle" style="background: #00CC00;"></div>Verde</div>
                        <div class="color-option" data-color="rojo" onclick="selectColor('rojo', this)"><div class="color-circle" style="background: #FF0000;"></div>Rojo</div>
                        <div class="color-option" data-color="amarillo" onclick="selectColor('amarillo', this)"><div class="color-circle" style="background: #FFD700;"></div>Amarillo</div>
                        <div class="color-option" data-color="negro" onclick="selectColor('negro', this)"><div class="color-circle" style="background: #1a1a1a;"></div>Negro</div>
                        <div class="color-option" data-color="naranja" onclick="selectColor('naranja', this)"><div class="color-circle" style="background: #FF8000;"></div>Naranja</div>
                    </div>
                    <input type="hidden" name="color_mug" id="color_mug">
                </div>
                <div class="form-group">
                    <label for="imagen">Subir NUEVA Lámina (Opcional):</label>
                    <input type="file" name="imagen" id="imagen" accept=".jpg, .jpeg, .png">
                    <p class="file-info">Archivo actual: <strong>${getFileNameFromUrl(pedido.imagen_url)}</strong><br>Si no sube un archivo, se conservará el actual.</p>
                </div>
                <div class="form-group">
                    <label for="plantilla">Subir NUEVA Plantilla .ai (Opcional):</label>
                    <input type="file" name="plantilla" id="plantilla" accept=".ai">
                    <p class="file-info">Plantilla actual conservada. Si cambia la lámina, debe subir la nueva plantilla.</p>
                </div>
            `;

            // Pre-llenar datos del Mug
            const tipoMugSelect = document.getElementById('tipo_mug');
            const colorMugInput = document.getElementById('color_mug');
            
            tipoMugSelect.value = pedido.tipo_mug || 'clasico';
            if (pedido.tipo_mug === 'color interno') {
                document.getElementById('color_options_container').style.display = 'block';
                colorMugInput.value = pedido.color_mug || '';
                // Seleccionar visualmente
                const option = document.querySelector(`.color-option[data-color="${pedido.color_mug}"]`);
                if (option) option.classList.add('selected');
            }

        } else if (esTextil) {
            let urlFrontal = pedido.imagenes ? pedido.imagenes.frontal : '';
            let urlEspaldar = pedido.imagenes ? pedido.imagenes.espaldar : '';
            
            // Fallback si no hay estructura imagenes
            if (!urlFrontal && !urlEspaldar) {
                if (pedido.imagen_url.includes('frontal')) urlFrontal = pedido.imagen_url;
                else if (pedido.imagen_url.includes('espaldar')) urlEspaldar = pedido.imagen_url;
                else urlFrontal = pedido.imagen_url;
            }

            dynamicFiles.innerHTML = `
                <div class="form-group">
                    <label for="lamina_frontal">Subir NUEVA Lámina Frontal (Opcional):</label>
                    <input type="file" name="lamina_frontal" id="lamina_frontal" accept=".jpg, .jpeg, .png">
                    <p class="file-info">Archivo actual: <strong>${getFileNameFromUrl(urlFrontal)}</strong><br>Si no sube un archivo, se conservará el actual.</p>
                </div>
                <div class="form-group">
                    <label for="lamina_espaldar">Subir NUEVA Lámina espaldar (Opcional):</label>
                    <input type="file" name="lamina_espaldar" id="lamina_espaldar" accept=".jpg, .jpeg, .png">
                    <p class="file-info">Archivo actual: <strong>${getFileNameFromUrl(urlEspaldar)}</strong><br>Si no sube un archivo, se conservará el actual.</p>
                </div>
                <div class="form-group">
                    <label for="plantilla">Subir NUEVA Plantilla .ai (Opcional):</label>
                    <input type="file" name="plantilla" id="plantilla" accept=".ai">
                    <p class="file-info">Plantilla actual conservada. Si cambia alguna lámina, debe subir la nueva plantilla.</p>
                </div>
            `;
        } else if (esGorra) {
            let urlFrontal = pedido.imagenes ? pedido.imagenes.frontal : (pedido.imagen_url || '');
            
            dynamicFiles.innerHTML = `
                <div class="form-group">
                    <label for="lamina_frontal">Subir NUEVA Lámina Frontal (Opcional):</label>
                    <input type="file" name="lamina_frontal" id="lamina_frontal" accept=".jpg, .jpeg, .png">
                    <p class="file-info">Archivo actual: <strong>${getFileNameFromUrl(urlFrontal)}</strong><br>Si no sube un archivo, se conservará el actual.</p>
                </div>
                <div class="form-group">
                    <label for="plantilla">Subir NUEVA Plantilla .ai (Opcional):</label>
                    <input type="file" name="plantilla" id="plantilla" accept=".ai">
                    <p class="file-info">Plantilla actual conservada. Si cambia la lámina, debe subir la nueva plantilla.</p>
                </div>
            `;
        }

        document.getElementById('pedidoForm').style.display = 'block';
    }

    // Funciones globales para manejar la selección de color
    window.toggleColorOptions = function() {
        const tipo = document.getElementById('tipo_mug').value;
        const container = document.getElementById('color_options_container');
        if (tipo === 'color interno') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
            document.getElementById('color_mug').value = ''; 
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        }
    };

    window.selectColor = function(color, element) {
        document.getElementById('color_mug').value = color;
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
    };

    document.getElementById('pedidoForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const alertBox = document.getElementById('mensajeAlert');
        const telefono = document.getElementById('telefono').value;
        const productoTipo = document.getElementById('producto_tipo').value;
        const originalUrl = document.getElementById('original_imagen_url').value;

        // Validar regla: Si se sube imagen, plantilla es obligatoria
        const imgInput = document.getElementById('imagen');
        const frontalInput = document.getElementById('lamina_frontal');
        const espaldarInput = document.getElementById('lamina_espaldar');
        const plantInput = document.getElementById('plantilla');

        let imagenCambiada = false;
        if (imgInput && imgInput.files.length > 0) imagenCambiada = true;
        if (frontalInput && frontalInput.files.length > 0) imagenCambiada = true;
        if (espaldarInput && espaldarInput.files.length > 0) imagenCambiada = true;

        if (imagenCambiada) {
            if (!plantInput || plantInput.files.length === 0) {
                alert("⚠️ ATENCIÓN: Si actualizas la imagen del diseño (Lámina), es OBLIGATORIO subir la nueva Plantilla (.ai) actualizada.");
                return;
            }
        }

        // Validar si al menos se cambió el teléfono, se subió un archivo o se cambiaron opciones de mug
        const files = Array.from(this.querySelectorAll('input[type="file"]')).filter(input => input.files.length > 0);
        
        let cambiosMug = false;
        if (productoTipo.toLowerCase().includes('mug')) {
            const nuevoTipo = document.getElementById('tipo_mug').value;
            const nuevoColor = document.getElementById('color_mug').value;
            if (nuevoTipo !== (currentPedido.tipo_mug || 'clasico') || nuevoColor !== (currentPedido.color_mug || '')) cambiosMug = true;
        }

        if (files.length === 0 && telefono === (currentPedido.telefono || currentPedido.teléfono) && !cambiosMug) {
            alert("No has realizado ningún cambio. Si no vas a hacer un cambio toca en '← Volver al Panel de Admin' debajo del botón de actualizar.");
            return;
        }

        alertBox.textContent = "Actualizando pedido en GitHub... Por favor espere, esto puede tardar.";
        alertBox.className = 'alert';
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = '#fff3cd';
        alertBox.style.color = '#856404';
        document.getElementById('btnSubmit').disabled = true;
        
        // 1. Generar nueva fecha
        const now = new Date();
        const dia = String(now.getDate()).padStart(2, '0');
        const mes = String(now.getMonth() + 1).padStart(2, '0');
        const anio = now.getFullYear();
        const hora = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const seg = String(now.getSeconds()).padStart(2, '0');
        const fechaCompleta = `${dia}/${mes}/${anio} ${hora}:${min}:${seg}`;
        const nuevoEstado = "Revisión del cliente";

        // 2. Preparar FormData
        const formData = new FormData();
        formData.append('original_imagen_url', originalUrl);
        formData.append('producto', productoTipo);
        formData.append('telefono', telefono);
        formData.append('fecha', fechaCompleta);
        formData.append('estado', nuevoEstado);
        
        // Sanitizar nombres de archivo y añadir a FormData
        const esTextil = ['camiseta', 'saco'].some(t => productoTipo.toLowerCase().includes(t));
        const esGorra = productoTipo.toLowerCase().includes('gorra');

        if (esTextil) {
            const frontalInput = document.getElementById('lamina_frontal');
            const espaldarInput = document.getElementById('lamina_espaldar');
            const plantillaInput = document.getElementById('plantilla');
            if (frontalInput.files.length > 0) formData.append('lamina_frontal', frontalInput.files[0], frontalInput.files[0].name.replace(/\s+/g, '_'));
            if (espaldarInput.files.length > 0) formData.append('lamina_espaldar', espaldarInput.files[0], espaldarInput.files[0].name.replace(/\s+/g, '_'));
            if (plantillaInput.files.length > 0) formData.append('plantilla', plantillaInput.files[0], plantillaInput.files[0].name.replace(/\s+/g, '_'));
        } else if (esGorra) {
            const frontalInput = document.getElementById('lamina_frontal');
            const plantillaInput = document.getElementById('plantilla');
            if (frontalInput.files.length > 0) formData.append('lamina_frontal', frontalInput.files[0], frontalInput.files[0].name.replace(/\s+/g, '_'));
            if (plantillaInput.files.length > 0) formData.append('plantilla', plantillaInput.files[0], plantillaInput.files[0].name.replace(/\s+/g, '_'));
        } else { // Es Mug
            const imgInput = document.getElementById('imagen');
            const plantInput = document.getElementById('plantilla');
            if (imgInput.files.length > 0) formData.append('imagen', imgInput.files[0], imgInput.files[0].name.replace(/\s+/g, '_'));
            if (plantInput.files.length > 0) formData.append('plantilla', plantInput.files[0], plantInput.files[0].name.replace(/\s+/g, '_'));
            
            formData.append('tipo_mug', document.getElementById('tipo_mug').value);
            if (document.getElementById('tipo_mug').value === 'color interno') formData.append('color_mug', document.getElementById('color_mug').value);
        }

        // 3. Enviar al Backend
        const BACKEND_URL = window.location.hostname.includes('github.io') 
            ? 'https://sublimacion-mary.onrender.com' 
            : '';

        fetch(`${BACKEND_URL}/api/pedidos/edit`, {
            method: 'POST',
            body: formData
        })
        .then(async response => {
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Error desconocido en el servidor.");
            return data;
        })
        .then(data => {
            const pedidoActualizado = data.pedido;

            // La notificación por correo ahora se maneja automáticamente en el servidor (server.js)
            return Promise.resolve();
        })
        .then(() => {
            alertBox.textContent = `¡Pedido actualizado con éxito! Redirigiendo al panel...`;
            alertBox.className = 'alert success';
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = 'admin_dashboard.html';
            }, 3000);
        })
        .catch(error => {
            alertBox.textContent = "Error: " + error.message;
            alertBox.className = 'alert error';
            alertBox.style.display = 'block';
            document.getElementById('btnSubmit').disabled = false;
        });
    });
</script>
</body>
</html>
