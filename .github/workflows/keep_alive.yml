name: Server Keep-Alive

on:
  schedule:
    # Programamos minutos específicos para "presionar" a GitHub a ser puntual
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch: # Permite que lo pruebes manualmente desde la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    # Si el servidor no responde en 2 minutos, cancelamos para no gastar tiempo de GitHub
    timeout-minutes: 2 
    steps:
      - name: Wake up Render
        run: |
          # Enviamos el pulso con un User-Agent que parezca un navegador real
          # Agregamos reintentos automáticos si la conexión falla
          STATUS=$(curl -s -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) WakeUpBot/1.0" \
            --connect-timeout 30 \
            --retry 3 \
            -o /dev/null -w "%{http_code}" \
            "https://sublimacion-mary.onrender.com/api/heartbeat?pinger=github&t=$(date +%s)")
          
          echo "💓 Pulso enviado. Código de respuesta: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then 
            echo "⚠️ El servidor no respondió con 200 (Posiblemente reiniciándose)."
          fi