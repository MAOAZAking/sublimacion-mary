name: Server Keep-Alive

on:
  schedule:
    # Se activa cada 14 minutos (Intervalo estratégico)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permite que lo pruebes manualmente desde la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Sublimación Mary Awake (Loop Mode)
        run: |
          # Realizaremos 2 pings con un intervalo de 7 minutos dentro de la misma ejecución.
          # Esto garantiza que el servidor reciba una señal de vida cada 7 minutos constantes,
          # incluso si el siguiente trigger de GitHub se retrasa.
          for i in {1..2}
          do
            echo "💓 Enviando pulso de vida $i a las $(date)"
            # --connect-timeout para esperar a que Render despierte si estaba dormido
            STATUS=$(curl -s -L --connect-timeout 60 -o /dev/null -w "%{http_code}" "https://sublimacion-mary.onrender.com/api/heartbeat?pinger=github&t=$(date +%s)")
            echo "Respuesta del servidor: $STATUS"
            
            if [ $i -lt 2 ]; then
              echo "Esperando 7 minutos para el siguiente pulso..."
              sleep 420
            fi
          done