name: Server Keep-Alive

on:
  schedule:
    # Listado explícito de minutos para "forzar" la prioridad en el programador de GitHub
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch: # Permite que lo pruebes manualmente desde la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20 
    steps:
      - name: Send Keep-Alive Pings
        run: |
          # Bucle de 15 minutos con pings cada 3 minutos.
          # Al durar 15 min y activarse cada 5 min, creamos un "solapamiento".
          # Si una ejecución se retrasa, la anterior todavía está enviando pings.
          for i in {1..5}
          do
            echo "💓 Pulso de vida $i (Ciclo de seguridad) enviado a las $(date)"
            STATUS=$(curl -s -L \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) WakeUpBot/1.0" \
              --connect-timeout 120 \
              --retry 10 \
              -o /dev/null -w "%{http_code}" \
              "https://sublimacion-mary.onrender.com/api/heartbeat?pinger=github&t=$(date +%s)")
            echo "Respuesta del servidor: $STATUS"
            
            if [ $i -lt 5 ]; then
              echo "Esperando 180 segundos para el próximo pulso interno..."
              sleep 180
            fi
          done