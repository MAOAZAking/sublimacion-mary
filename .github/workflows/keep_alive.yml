name: Server Keep-Alive

on:
  schedule:
    # Programación explícita cada 5 minutos para mayor prioridad en GitHub
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch: # Permite que lo pruebes manualmente desde la pestaña Actions de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12 
    steps:
      - name: Send Keep-Alive Pings
        run: |
          # Bucle de 10 minutos enviando pings cada 2.5 minutos.
          # Esto cubre los huecos cuando GitHub tarda en iniciar la siguiente tarea programada.
          for i in {1..4}
          do
            echo "💓 Pulso de vida $i enviado a las $(date)"
            STATUS=$(curl -s -L \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) WakeUpBot/1.0" \
              --connect-timeout 60 \
              --retry 5 \
              -o /dev/null -w "%{http_code}" \
              "https://sublimacion-mary.onrender.com/api/heartbeat?pinger=github&t=$(date +%s)")
            echo "Respuesta del servidor: $STATUS"
            
            if [ $i -lt 4 ]; then
              echo "Esperando 150 segundos para el próximo pulso interno..."
              sleep 150
            fi
          done