<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuevo Pedido - Admin</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="js/global.js"></script>
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        // SEGURIDAD: Verificar si el usuario inició sesión
        if (!sessionStorage.getItem('adminLogueado')) {
            window.location.href = 'index.html';
        } else {
            // Mostrar contenido solo si está logueado (evita parpadeo de contenido prohibido)
            document.documentElement.style.display = 'block';
        }
    </script>
    <style>
        html { display: none; } /* Ocultar todo el sitio por defecto hasta verificar sesión */
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; }
        /* Estilos para opciones de color */
        .color-options { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
        .color-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 2px solid #333; border-radius: 20px; cursor: pointer; transition: all 0.3s; background: #2d2d2d; }
        .color-option:hover { border-color: #888; }
        .color-option.selected { border-color: #9b59b6; background: #3a2e42; box-shadow: 0 0 10px rgba(155, 89, 182, 0.3); }
        .color-circle { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-uib-container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
    <h3 style="margin: 20px 20px 0; text-align: center;">Estamos preparando ¡LA MEJOR EXPERIENCIA PARA TI!</h3>
</div>

<div class="container">
    <h2>Crear Nuevo Pedido</h2>

    <div id="mensajeAlert" class="alert"></div>

    <form id="pedidoForm" action="https://formsubmit.co/378c29d9d55d65ab60b67264f0d7b6d8" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="_subject" value="Nuevo Pedido de Sublimación">
        <input type="hidden" name="_cc" id="cc_email" value="maoaza13579@gmail.com">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <div class="form-group">
            <label for="producto">Tipo de Producto:</label>
            <select name="producto" id="producto" required>
                <option value="" disabled selected>Seleccione una opción</option>
                <option value="Mug Personalizado">Mug</option>
                <option value="Camiseta Estampada">Camiseta</option>
                <option value="Saco Estampado">Saco</option>
                <option value="Gorra Estampada">Gorra</option>
            </select>
        </div>

        <div id="dynamic-files"></div>

        <div class="form-group">
            <label for="telefono">Número Celular (Cliente):</label>
            <input type="tel" name="telefono" id="telefono" placeholder="Ej: 3001234567" required pattern="[0-9]+" disabled>
        </div>

        <button type="submit" id="btnSubmit" disabled>Guardar Pedido</button>
    </form>
    
    <a href="admin_dashboard.html" class="back-link">← Volver al Panel de Admin</a>
</div>

<div class="footer-copy">
    &copy; <span id="copyright-year"></span> Sublimación Mary. Todo personalizado.
</div>

<script>
    // Lógica de inactividad (5 minutos)
    let inactivityTimeout;
    function resetInactivityTimer() {
        clearTimeout(inactivityTimeout);
        inactivityTimeout = setTimeout(() => {
            sessionStorage.removeItem('adminLogueado');
            alert("Sesión cerrada por inactividad.");
            window.location.href = 'index.html';
        }, 5 * 60 * 1000); // 5 minutos
    }
    // Eventos que reinician el temporizador
    ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => 
        document.addEventListener(evt, resetInactivityTimer, false)
    );
    resetInactivityTimer(); // Iniciar al cargar

    // Lógica dinámica del formulario
    const productoSelect = document.getElementById('producto');
    const dynamicFiles = document.getElementById('dynamic-files');
    const telefonoInput = document.getElementById('telefono');
    const btnSubmit = document.getElementById('btnSubmit');

    productoSelect.addEventListener('change', function() {
        const tipo = this.value;
        dynamicFiles.innerHTML = '';
        
        if (tipo) {
            telefonoInput.disabled = false;
            btnSubmit.disabled = false;

            if (tipo === 'Mug Personalizado') {
                dynamicFiles.innerHTML = `
                    <div class="form-group">
                        <label for="tipo_mug">Tipo de Mug:</label>
                        <select name="tipo_mug" id="tipo_mug" onchange="toggleColorOptions()">
                            <option value="clasico" selected>Clásico (Blanco)</option>
                            <option value="color interno">Color Interno</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="color_options_container" style="display:none;">
                        <label>Selecciona el Color Interno:</label>
                        <div class="color-options" id="color_options">
                            <div class="color-option" onclick="selectColor('rosado', this)"><div class="color-circle" style="background: #FF69B4;"></div>Rosado</div>
                            <div class="color-option" onclick="selectColor('verde', this)"><div class="color-circle" style="background: #00CC00;"></div>Verde</div>
                            <div class="color-option" onclick="selectColor('rojo', this)"><div class="color-circle" style="background: #FF0000;"></div>Rojo</div>
                            <div class="color-option" onclick="selectColor('amarillo', this)"><div class="color-circle" style="background: #FFD700;"></div>Amarillo</div>
                            <div class="color-option" onclick="selectColor('negro', this)"><div class="color-circle" style="background: #1a1a1a;"></div>Negro</div>
                            <div class="color-option" onclick="selectColor('naranja', this)"><div class="color-circle" style="background: #FF8000;"></div>Naranja</div>
                        </div>
                        <input type="hidden" name="color_mug" id="color_mug">
                    </div>

                    <div class="form-group">
                        <label for="imagen">Subir Lámina (Imagen del diseño):</label>
                        <input type="file" name="imagen" id="imagen" accept=".jpg, .jpeg, .png" required>
                    </div>
                    <div class="form-group">
                        <label for="plantilla">Subir Plantilla (.ai, .psd, .pdf, etc):</label>
                        <input type="file" name="plantilla" id="plantilla" accept=".ai, .psd, .psb, .psdc, .eps, .pdf, .svg, .tiff, .ait" required>
                    </div>
                    <div class="form-group">
                        <label for="foto_diseno">Foto usada en el diseño (Opcional):</label>
                        <input type="file" name="foto_diseno" id="foto_diseno" accept=".jpg, .jpeg, .png, .webp">
                    </div>
                `;
            } else if (['Camiseta Estampada', 'Saco Estampado'].includes(tipo)) {
                dynamicFiles.innerHTML = `
                    <div class="form-group">
                        <label for="lamina_frontal">Subir Lámina Frontal (Imagen del diseño):</label>
                        <input type="file" name="lamina_frontal" id="lamina_frontal" accept=".jpg, .jpeg, .png">
                    </div>
                    <div class="form-group">
                        <label for="lamina_espaldar">Subir Lámina espaldar (Imagen del diseño):</label>
                        <input type="file" name="lamina_espaldar" id="lamina_espaldar" accept=".jpg, .jpeg, .png">
                    </div>
                    <div class="form-group">
                        <label for="plantilla">Subir Plantilla (.ai, .psd, .pdf, etc):</label>
                        <input type="file" name="plantilla" id="plantilla" accept=".ai, .psd, .psb, .psdc, .eps, .pdf, .svg, .tiff, .ait" required>
                    </div>
                    <div class="form-group">
                        <label for="foto_diseno">Foto usada en el diseño (Opcional):</label>
                        <input type="file" name="foto_diseno" id="foto_diseno" accept=".jpg, .jpeg, .png, .webp">
                    </div>
                    <p style="font-size: 0.85rem; color: #666; margin-top: -10px; margin-bottom: 20px;">* Es obligatorio subir al menos una de las dos láminas y la plantilla.</p>
                `;
            } else if (tipo === 'Gorra Estampada') {
                dynamicFiles.innerHTML = `
                    <div class="form-group">
                        <label for="lamina_frontal">Subir Lámina Frontal (Imagen del diseño):</label>
                        <input type="file" name="lamina_frontal" id="lamina_frontal" accept=".jpg, .jpeg, .png" required>
                    </div>
                    <div class="form-group">
                        <label for="plantilla">Subir Plantilla (.ai, .psd, .pdf, etc):</label>
                        <input type="file" name="plantilla" id="plantilla" accept=".ai, .psd, .psb, .psdc, .eps, .pdf, .svg, .tiff, .ait" required>
                    </div>
                    <div class="form-group">
                        <label for="foto_diseno">Foto usada en el diseño (Opcional):</label>
                        <input type="file" name="foto_diseno" id="foto_diseno" accept=".jpg, .jpeg, .png, .webp">
                    </div>
                `;
            }
        } else {
            telefonoInput.disabled = true;
            btnSubmit.disabled = true;
        }
    });

    // Funciones globales para manejar la selección de color
    window.toggleColorOptions = function() {
        const tipo = document.getElementById('tipo_mug').value;
        const container = document.getElementById('color_options_container');
        if (tipo === 'color interno') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
            document.getElementById('color_mug').value = ''; // Limpiar color si vuelve a clásico
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        }
    };

    window.selectColor = function(color, element) {
        document.getElementById('color_mug').value = color;
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
    };

    document.getElementById('pedidoForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const producto = document.getElementById('producto').value;
        const telefono = document.getElementById('telefono').value;
        const alertBox = document.getElementById('mensajeAlert');

        // Validaciones específicas
        let valid = false;
        if (producto === 'Mug Personalizado') {
            const img = document.getElementById('imagen');
            const plant = document.getElementById('plantilla');
            const tipoMug = document.getElementById('tipo_mug').value;
            const colorMug = document.getElementById('color_mug').value;
            if (tipoMug === 'color interno' && !colorMug) {
                alert("Por favor seleccione un color para el Mug.");
                return;
            }
            if (img && img.files.length > 0 && plant && plant.files.length > 0) valid = true;
        } else if (['Camiseta Estampada', 'Saco Estampado'].includes(producto)) {
            const frontal = document.getElementById('lamina_frontal');
            const espaldar = document.getElementById('lamina_espaldar');
            const plantilla = document.getElementById('plantilla');
            
            if (((frontal && frontal.files.length > 0) || (espaldar && espaldar.files.length > 0)) && (plantilla && plantilla.files.length > 0)) valid = true;
            else {
                alert("Debe subir al menos una lámina para el producto textil (Frontal o Espaldar) y la plantilla.");
                return;
            }
        } else if (producto === 'Gorra Estampada') {
            const frontal = document.getElementById('lamina_frontal');
            const plantilla = document.getElementById('plantilla');
            if (frontal && frontal.files.length > 0 && plantilla && plantilla.files.length > 0) valid = true;
            else {
                alert("Para la gorra es obligatorio subir la lámina frontal y la plantilla.");
                return;
            }
        }

        if (producto && telefono && valid) {
            
            alertBox.textContent = "Subiendo archivos a GitHub y actualizando base de datos... Por favor espere.";
            alertBox.className = 'alert';
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = '#fff3cd';
            alertBox.style.color = '#856404';
            
            // 1. Generar datos básicos
            const now = new Date();
            const dia = String(now.getDate()).padStart(2, '0');
            const mes = String(now.getMonth() + 1).padStart(2, '0');
            const anio = now.getFullYear();
            const hora = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const seg = String(now.getSeconds()).padStart(2, '0');
            const fechaCompleta = `${dia}/${mes}/${anio} ${hora}:${min}:${seg}`;
            const estadoInicial = "Revisión del cliente";

            // 2. Preparar FormData para enviar al servidor local
            const formData = new FormData();
            formData.append('producto', producto);
            formData.append('telefono', telefono);
            formData.append('fecha', fechaCompleta);
            formData.append('estado', estadoInicial);
            
            // Sanitizar nombres de archivo (reemplazar espacios por guiones) antes de enviar
            if (producto === 'Mug Personalizado') {
                const tipoMug = document.getElementById('tipo_mug').value;
                formData.append('tipo_mug', tipoMug);
                if (tipoMug === 'color interno') {
                    formData.append('color_mug', document.getElementById('color_mug').value);
                }
                const imgFile = document.getElementById('imagen').files[0];
                const plantFile = document.getElementById('plantilla').files[0];
                const fotoDiseno = document.getElementById('foto_diseno').files[0];
                formData.append('imagen', imgFile, imgFile.name.replace(/\s+/g, '-'));
                formData.append('plantilla', plantFile, plantFile.name.replace(/\s+/g, '-'));
                if (fotoDiseno) formData.append('foto_diseno', fotoDiseno, fotoDiseno.name.replace(/\s+/g, '-'));
            } else if (['Camiseta Estampada', 'Saco Estampado'].includes(producto)) {
                const frontalInput = document.getElementById('lamina_frontal');
                const espaldarInput = document.getElementById('lamina_espaldar');
                const plantillaInput = document.getElementById('plantilla');
                const fotoDisenoInput = document.getElementById('foto_diseno');
                if (frontalInput.files.length > 0) formData.append('lamina_frontal', frontalInput.files[0], frontalInput.files[0].name.replace(/\s+/g, '-'));
                if (espaldarInput.files.length > 0) formData.append('lamina_espaldar', espaldarInput.files[0], espaldarInput.files[0].name.replace(/\s+/g, '-'));
                if (plantillaInput.files.length > 0) formData.append('plantilla', plantillaInput.files[0], plantillaInput.files[0].name.replace(/\s+/g, '-'));
                if (fotoDisenoInput.files.length > 0) formData.append('foto_diseno', fotoDisenoInput.files[0], fotoDisenoInput.files[0].name.replace(/\s+/g, '-'));
            } else if (producto === 'Gorra Estampada') {
                const frontalInput = document.getElementById('lamina_frontal');
                const plantillaInput = document.getElementById('plantilla');
                const fotoDisenoInput = document.getElementById('foto_diseno');
                if (frontalInput.files.length > 0) formData.append('lamina_frontal', frontalInput.files[0], frontalInput.files[0].name.replace(/\s+/g, '-'));
                if (plantillaInput.files.length > 0) formData.append('plantilla', plantillaInput.files[0], plantillaInput.files[0].name.replace(/\s+/g, '-'));
                if (fotoDisenoInput.files.length > 0) formData.append('foto_diseno', fotoDisenoInput.files[0], fotoDisenoInput.files[0].name.replace(/\s+/g, '-'));
            }

            // 3. Enviar al Backend (Detectar si estamos en GitHub Pages o Local/Render)
            // Si estamos en github.io, usamos la URL de Render. Si no, usamos la ruta relativa.
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            fetch(`${BACKEND_URL}/api/pedidos`, {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || "Error desconocido en el servidor.");
                return data;
            })
            .then(data => {
                // El backend nos devuelve el objeto del pedido creado
                const nuevoPedido = data.pedido;

                // 4. Enviar correo de notificación
                const formDataEmail = new FormData();
                formDataEmail.append('_subject', 'Nuevo Pedido JSON');
                const adminEmail = sessionStorage.getItem('adminEmail') || 'maoaza13579@gmail.com';
                formDataEmail.append('_cc', adminEmail);
                formDataEmail.append('_captcha', 'false');
                formDataEmail.append('_template', 'table');
                formDataEmail.append('datos_pedido', JSON.stringify(nuevoPedido, null, 4));

                return fetch("https://formsubmit.co/ajax/378c29d9d55d65ab60b67264f0d7b6d8", { method: "POST", body: formDataEmail });
            })
            .then(() => {
                alertBox.textContent = `¡Pedido creado con éxito!`;
                alertBox.className = 'alert success';
                alertBox.style.display = 'block';
                document.getElementById('pedidoForm').reset();
            })
            .catch(error => {
                alertBox.textContent = "Error: " + error.message;
                alertBox.className = 'alert error';
                alertBox.style.display = 'block';
            });
        }
    });
</script>
</body>
</html>
