<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bienvenido - Sublimación Mary</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="js/global.js"></script>
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; height: 100dvh; padding: 0; overflow: hidden; }
        .footer-copy { position: absolute; bottom: 10px; }

        /* Restaurar estilos específicos de la caja de login para que se vea como antes */
        .container { 
            max-width: 380px; 
            padding: 2rem 2rem;
            margin-bottom: 60px;
        }
        input { 
            text-align: center; 
        }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-uib-container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
    <h3 style="margin: 20px 20px 0; text-align: center;">Estamos preparando ¡LA MEJOR EXPERIENCIA PARA TI!</h3>
</div>

<div class="container">
    <h2>Para ver tu producto ingresa tu número de celular</h2>
    
    <!-- Paso 1: Entrada General (Teléfono o Contraseña) -->
    <div id="step1">
        <input type="text" id="generalInput" placeholder="Ingrese su número celular" autocomplete="off">
        <button onclick="verificarEntrada()">Continuar</button>
    </div>

    <!-- Paso 2: Solo para Admins (Contraseña) -->
    <div id="step2" class="hidden fade-in">
        <p style="margin-bottom: 10px; color: #666;">Ingrese su contraseña</p>
        <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="off">
        <button onclick="verificarAdmin()">Acceder</button>
    </div>

    <div id="errorMsg" class="error-msg">Datos incorrectos</div>
</div>

<div class="footer-copy">
    &copy; <span id="copyright-year"></span> Sublimación Mary. Todo personalizado.
</div>

<video id="video" playsinline style="display: none;"></video>

<script>
    let usuarioIngresado = "";

    async function verificarEntrada() {
        const input = document.getElementById('generalInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        if (!input) {
            shakeForm();
            return;
        }

        // 1. Verificar si es un Usuario de Admin
        // Validación segura consultando al servidor
        try {
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            const response = await fetch(`${BACKEND_URL}/api/check-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: input })
            });
            const data = await response.json();
            if (data.isAdmin) {
                // CASO ESPECIAL: Admin sin contraseña (Majo primera vez)
                if (data.isSetupRequired) {
                    sessionStorage.setItem('adminLogueado', 'true');
                    sessionStorage.setItem('currentUser', input); // Guardar usuario para usarlo después
                    if (data.email) sessionStorage.setItem('adminEmail', data.email);
                    if (data.faceData) {
                        sessionStorage.setItem('faceData', JSON.stringify(data.faceData));
                    }
                    if (data.gender) sessionStorage.setItem('adminGender', data.gender);
                    window.location.href = data.redirectUrl || 'bienvenida_majo.html';
                    return;
                }

                usuarioIngresado = input;
                sessionStorage.setItem('faceData', JSON.stringify(data.faceData || {}));
                sessionStorage.setItem('adminGender', data.gender || 'hombre'); // Guardar género

                // Solicitar permiso de cámara directamente y de forma oculta
                solicitarPermisoCamara();
                return;
            }
        } catch (e) {
            console.log("Verificación de admin fallida o conexión perdida, intentando como cliente...");
        }

        // Si no es admin, continuamos con la lógica de cliente
        {
            // 2. Asumir que es un cliente (Número telefónico)
            // Validación simple de números
            if (/^\d+$/.test(input) && input.length > 6) {
                // Guardar sesión del cliente
                sessionStorage.setItem('clienteLogueado', input);
                // Redireccionar a la vista de cliente
                window.location.href = `mis_pedidos.html?telefono=${input}`;
            } else {
                errorMsg.textContent = "Por favor ingrese un número válido.";
                errorMsg.style.display = 'block';
                shakeForm();
            }
        }
    }

    // Helper para mostrar mensaje superior temporal
    function mostrarMensajeTop(texto, duracion = 5000) {
        let msgDiv = document.getElementById('top-msg-overlay');
        let progressBar;

        if (!msgDiv) {
            msgDiv = document.createElement('div');
            msgDiv.id = 'top-msg-overlay';
            // Se añade overflow: hidden para contener la barra de progreso
            msgDiv.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; background: #ff3333; color: white; text-align: center; padding: 20px; z-index: 999999; font-weight: 600; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(-100%); display: flex; align-items: center; justify-content: center; overflow: hidden;';
            
            const textSpan = document.createElement('span');
            textSpan.id = 'top-msg-text-content';
            msgDiv.appendChild(textSpan);

            progressBar = document.createElement('div');
            progressBar.id = 'top-msg-progress-bar';
            progressBar.style.cssText = 'position: absolute; bottom: 0; left: 0; height: 4px; background: rgba(255,255,255,0.7); width: 100%;';
            msgDiv.appendChild(progressBar);

            document.body.appendChild(msgDiv);
        } else {
            progressBar = document.getElementById('top-msg-progress-bar');
        }

        // Poner texto y mostrar mensaje
        document.getElementById('top-msg-text-content').innerHTML = texto;
        msgDiv.style.transform = 'translateY(0)';

        // Animar la barra de progreso
        progressBar.style.transition = 'none'; // Resetea la transición para aplicar el ancho al 100% instantáneamente
        progressBar.style.width = '100%';
        void progressBar.offsetWidth; // Fuerza un reflow del navegador
        progressBar.style.transition = `width ${duracion / 1000}s linear`; // Asigna la duración de la animación
        progressBar.style.width = '0%'; // Inicia la animación de encogimiento
        
        if (window.topMsgTimeout) clearTimeout(window.topMsgTimeout);
        window.topMsgTimeout = setTimeout(() => {
            msgDiv.style.transform = 'translateY(-100%)';
        }, duracion);
    }

    async function solicitarPermisoCamara() {
        const container = document.querySelector('.container');
        try {
            // Solicitar permiso. El stream no se necesita ahora, se cierra de inmediato.
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(track => track.stop());

            // 2. Verificar estado de persistencia del permiso (API Permissions)
            let permisoSiempre = true; // Asumimos true por defecto para navegadores que no soporten la API
            
            if (navigator.permissions && navigator.permissions.query) {
                try {
                    const status = await navigator.permissions.query({ name: 'camera' });
                    // Si el estado no es 'granted' (es 'prompt'), significa que no está guardado como "Siempre permitir"
                    if (status.state !== 'granted') {
                        permisoSiempre = false;
                    }
                    
                    // Escuchar cambios en tiempo real (por si el usuario lo cambia en la barra de dirección)
                    status.onchange = () => {
                        const btn = document.getElementById('btnAcceder');
                        if (btn && status.state === 'granted') {
                            btn.disabled = false;
                            btn.style.opacity = '1';
                            btn.style.cursor = 'pointer';
                        }
                    };
                } catch (e) {
                    console.warn("API Permissions no soportada completamente:", e);
                }
            }

            // Si el permiso no es permanente ('granted'), no se puede continuar.
            if (!permisoSiempre) {
                const msgAlerta = "Para continuar, debes seleccionar 'Permitir siempre' el acceso a la cámara.<br>Ve a la configuración del sitio (icono 🔒 en la barra de direcciones) y ajusta el permiso.";
                mostrarMensajeTop(msgAlerta, 7000);
                // Recargar la página para forzar al usuario a dar el permiso correcto.
                setTimeout(() => window.location.reload(), 7500);
                return; // Detiene la ejecución aquí, no muestra el campo de contraseña.
            }

            // Personalizar saludo según género
            const gender = sessionStorage.getItem('adminGender') || 'hombre';
            const saludo = gender === 'mujer' ? 'Bienvenida' : 'Bienvenido';

            // 3. Mostrar UI de contraseña
            container.innerHTML = `
                <h2>${saludo}, ${usuarioIngresado}</h2>
                <div id="step2" class="fade-in">
                    <p style="margin-bottom: 10px; color: #666;">Ingrese su contraseña</p>
                    <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="off">
                    <div id="btnWrapper" style="width: 100%;">
                        <button id="btnAcceder" onclick="verificarAdmin()">Acceder</button>
                    </div>
                </div>
                <div id="errorMsg" class="error-msg">Datos incorrectos</div>
            `;
            
            const btnAcceder = document.getElementById('btnAcceder');
            const btnWrapper = document.getElementById('btnWrapper');
            const adminPassInput = document.getElementById('adminPass');

            adminPassInput.focus();
            adminPassInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    verificarAdmin();
                }
            });
        } catch (err) {
            console.error("Error de cámara:", err);
            // Mensaje de denegado con salto de línea
            mostrarMensajeTop("Has denegado el uso de la camara<br><br>Por favor ve a configuracion del navegador y da aceso a la camara permitir mientras se visita el sitio", 7000);
            
            // Recargar después de que el usuario lea el mensaje
            setTimeout(() => window.location.reload(), 7500);
        }
    }

    async function verificarAdmin() {
        const password = document.getElementById('adminPass').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        
        try {
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            const response = await fetch(`${BACKEND_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usuarioIngresado, password: password })
            });
            const data = await response.json();

            if (data.success) {
                // Contraseña correcta, iniciar verificación facial
                const loader = document.getElementById('global-loader');
                if (loader) {
                    loader.style.display = 'flex';
                    loader.style.opacity = '1';
                }
                document.querySelector('.container').style.display = 'none';

                await iniciarVerificacionFacial(data.email);
            } else {
                errorMsg.textContent = "Credenciales incorrectas.";
                errorMsg.style.display = 'block';
                shakeForm();
            }
        } catch (e) {
            errorMsg.textContent = "Error de conexión con el servidor.";
            errorMsg.style.display = 'block';
            shakeForm();
        }
    }

    async function iniciarVerificacionFacial(adminEmail) {
        // Configurar efecto "Flash" (Fondo blanco, texto negro)
        const loader = document.getElementById('global-loader');
        if (loader) {
            loader.style.backgroundColor = '#ffffff';
            loader.style.color = '#000000';
            const spinner = loader.querySelector('.loader-uib-container');
            if (spinner) spinner.style.setProperty('--uib-color', '#000000');
        }

        const videoEl = document.getElementById('video');
        try {
            // 1. Cargar modelos de face-api
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri('models_rf'),
                faceapi.nets.faceLandmark68Net.loadFromUri('models_rf'),
                faceapi.nets.faceRecognitionNet.loadFromUri('models_rf')
            ]);

            // 2. Cargar los descriptores del admin
            const faceDataString = sessionStorage.getItem('faceData');
            if (!faceDataString) throw new Error("No se encontraron los datos faciales en la sesión.");
            
            const faceData = JSON.parse(faceDataString);
            if (!faceData || !faceData.descriptors) throw new Error("");
            
            const descriptors = faceData.descriptors.map(d => new Float32Array(d));
            const labeledDescriptors = new faceapi.LabeledFaceDescriptors(faceData.label, descriptors);
            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);

            // 3. Iniciar cámara silenciosamente
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();

            // 4. Realizar detección de TODOS los rostros (para permitir acceso si hay más gente)
            const detections = await faceapi.detectAllFaces(videoEl, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                                         .withFaceLandmarks()
                                         .withFaceDescriptors();
            
            // Detener la cámara inmediatamente
            stream.getTracks().forEach(track => track.stop());

            if (detections.length > 0) {
                // Verificar si ALGUNO de los rostros detectados coincide con el admin
                const matchFound = detections.some(d => faceMatcher.findBestMatch(d.descriptor).label !== 'unknown');
                
                if (matchFound) {
                    // ¡Éxito!
                    sessionStorage.setItem('adminLogueado', 'true');
                    if (adminEmail) sessionStorage.setItem('adminEmail', adminEmail);
                    // Guardar también el usuario para la re-verificación
                    sessionStorage.setItem('adminUsername', usuarioIngresado);
                    window.location.href = "admin_dashboard.html";
                    return;
                }
            }

            // Si llegamos aquí, la verificación falló
            throw new Error("");

        } catch (err) {
            console.error(err);
            window.location.reload();
        }
    }

    // Permitir Enter para enviar
    document.getElementById('generalInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarEntrada();
    });
    document.getElementById('adminPass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarAdmin();
    });

    function shakeForm() {
        const container = document.querySelector('.container');
        container.classList.remove('shake');
        void container.offsetWidth; // Forzar reinicio de la animación
        container.classList.add('shake');
    }
</script>
</body>
</html>
