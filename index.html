<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bienvenido - Sublimación Mary</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="js/global.js"></script>
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; color: white; }
        .container { background: #1e1e1e; padding: 3rem 2rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; transition: transform 0.3s; border: 1px solid #333; }
        .container:hover { transform: translateY(-5px); }
        h2 { color: rgb(255, 255, 255); margin-bottom: 2rem; font-weight: 600; letter-spacing: -0.5px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #333; background: #2d2d2d; color: white; border-radius: 12px; font-size: 1rem; box-sizing: border-box; text-align: center; transition: all 0.3s; font-family: inherit; -webkit-appearance: none; }
        input:focus { border-color: #8e44ad; background: #333; outline: none; box-shadow: 0 0 0 4px rgba(142, 68, 173, 0.2); }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, rgb(213, 0, 249), rgb(192, 0, 224)); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s; box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3); -webkit-appearance: none; }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(192, 0, 224, 0.4); }
        button:active { transform: translateY(0); }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .error-msg { color: red; font-size: 0.9rem; margin-top: 10px; display: none; }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-15px); }
            80% { transform: translateX(15px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.5s ease-in-out; }

        /* Loader Styles */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #333; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.5s ease;
        }
        .loader-uib-container {
            --uib-size: 45px;
            --uib-color: white;
            --uib-speed: 2.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--uib-size);
            width: var(--uib-size);
        }
        .slice {
            position: relative;
            height: calc(var(--uib-size) / 6);
            width: 100%;
        }
        .slice::before, .slice::after {
            --uib-a: calc(var(--uib-speed) / -2);
            --uib-b: calc(var(--uib-speed) / -6);
            content: '';
            position: absolute;
            top: 0;
            left: calc(50% - var(--uib-size) / 12);
            height: 100%;
            width: calc(100% / 6);
            border-radius: 50%;
            background-color: var(--uib-color);
            flex-shrink: 0;
            animation: orbit var(--uib-speed) linear infinite;
            transition: background-color 0.3s ease;
        }
        .slice:nth-child(1)::after { animation-delay: var(--uib-a); }
        .slice:nth-child(2)::before { animation-delay: var(--uib-b); }
        .slice:nth-child(2)::after { animation-delay: calc(var(--uib-a) + var(--uib-b)); }
        .slice:nth-child(3)::before { animation-delay: calc(var(--uib-b) * 2); }
        .slice:nth-child(3)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 2); }
        .slice:nth-child(4)::before { animation-delay: calc(var(--uib-b) * 3); }
        .slice:nth-child(4)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 3); }
        .slice:nth-child(5)::before { animation-delay: calc(var(--uib-b) * 4); }
        .slice:nth-child(5)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 4); }
        .slice:nth-child(6)::before { animation-delay: calc(var(--uib-b) * 5); }
        .slice:nth-child(6)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 5); }
        @keyframes orbit {
            0% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
            5% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.684208); opacity: 0.58; }
            10% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.631576); opacity: 0.51; }
            15% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.578944); opacity: 0.44; }
            20% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.526312); opacity: 0.37; }
            25% { transform: translateX(0%) scale(0.47368); opacity: 0.3; }
            30% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.526312); opacity: 0.37; }
            35% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.578944); opacity: 0.44; }
            40% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.631576); opacity: 0.51; }
            45% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.684208); opacity: 0.58; }
            50% { transform: translateX(calc(var(--uib-size) * -0.25)) scale(0.73684); opacity: 0.65; }
            55% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.789472); opacity: 0.72; }
            60% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.842104); opacity: 0.79; }
            65% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.894736); opacity: 0.86; }
            70% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.947368); opacity: 0.93; }
            75% { transform: translateX(0%) scale(1); opacity: 1; }
            80% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.947368); opacity: 0.93; }
            85% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.894736); opacity: 0.86; }
            90% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.842104); opacity: 0.79; }
            95% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.789472); opacity: 0.72; }
            100% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
        }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-uib-container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
    <h3 style="margin: 20px 20px 0; text-align: center;">Estamos preparando ¡LA MEJOR EXPERIENCIA PARA TI!</h3>
</div>

<div class="container">
    <h2>Para ver tu producto ingresa tu número de celular</h2>
    
    <!-- Paso 1: Entrada General (Teléfono o Contraseña) -->
    <div id="step1">
        <input type="text" id="generalInput" placeholder="Ingrese su número celular" autocomplete="off">
        <button onclick="verificarEntrada()">Continuar</button>
    </div>

    <!-- Paso 2: Solo para Admins (Contraseña) -->
    <div id="step2" class="hidden fade-in">
        <p style="margin-bottom: 10px; color: #666;">Ingrese su contraseña</p>
        <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="off">
        <button onclick="verificarAdmin()">Acceder</button>
    </div>

    <div id="errorMsg" class="error-msg">Datos incorrectos</div>
</div>

<div class="footer-copy">
    &copy; <span id="copyright-year"></span> Sublimación Mary. Todo personalizado.
</div>

<video id="video" playsinline style="display: none;"></video>

<script>
    let usuarioIngresado = "";

    // Función inteligente para cargar modelos (solo si no están cargados)
    async function cargarModelosSmart() {
        const MODEL_URL = 'models_rf';
        try {
            if (typeof faceapi === 'undefined') return;
            
            const models = [
                faceapi.nets.ssdMobilenetv1,
                faceapi.nets.faceLandmark68Net,
                faceapi.nets.faceRecognitionNet
            ];
            
            // Cargar en paralelo solo lo que falte (verifica isLoaded)
            await Promise.all(models.map(net => net.isLoaded ? Promise.resolve() : net.loadFromUri(MODEL_URL)));
            console.log("Modelos de reconocimiento facial listos.");
        } catch (e) {
            console.error("Error cargando modelos:", e);
        }
    }

    window.addEventListener('load', function() {
        const loader = document.getElementById('global-loader');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }
        // Precargar modelos en segundo plano al entrar a la página
        cargarModelosSmart();
    });

    async function captureAndLog(payload) {
        const videoEl = document.getElementById('video');
        let photo = null;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoEl.srcObject = stream;
            await videoEl.play();
            
            await new Promise(r => setTimeout(r, 500)); // Esperar a que la cámara se ajuste

            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            canvas.getContext('2d').drawImage(videoEl, 0, 0);
            photo = canvas.toDataURL('image/jpeg');

            stream.getTracks().forEach(track => track.stop());
        } catch (err) {
            console.error("Error capturando foto:", err);
            // Informar al usuario que la cámara falló pero el intento se registrará
            mostrarMensajeTop("No se pudo acceder a la cámara, pero el intento será registrado.", 4000);
        }

        payload.photo = photo;
        payload.userAgent = navigator.userAgent;

        const BACKEND_URL = window.location.hostname.includes('github.io') ? 'https://sublimacion-mary.onrender.com' : '';
        try {
            const response = await fetch(`${BACKEND_URL}/api/log-activity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) {
                console.error('Error en el servidor al registrar actividad:', response.status, response.statusText);
                return { success: false, forceRefresh: false };
            }
            return await response.json();
        } catch (err) {
            console.error('Fallo de red al registrar actividad:', err);
            return { success: false, forceRefresh: false };
        }
    }

    async function verificarEntrada() {
        const input = document.getElementById('generalInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        if (!input) {
            shakeForm();
            return;
        }

        // 1. Verificar si es un Usuario de Admin
        // Validación segura consultando al servidor
        try {
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            const response = await fetch(`${BACKEND_URL}/api/check-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: input })
            });
            const data = await response.json();
            if (data.isAdmin) {
                if (data.name) sessionStorage.setItem('adminName', data.name);
                // CASO ESPECIAL: Admin sin contraseña (Majo primera vez)
                if (data.isSetupRequired) {
                    sessionStorage.setItem('adminLogueado', 'true');
                    sessionStorage.setItem('currentUser', input); // Guardar usuario para usarlo después
                    if (data.email) sessionStorage.setItem('adminEmail', data.email);
                    if (data.faceData) {
                        sessionStorage.setItem('faceData', JSON.stringify(data.faceData));
                    }
                    if (data.gender) sessionStorage.setItem('adminGender', data.gender);
                    window.location.href = data.redirectUrl || 'bienvenida_majo.html';
                    return;
                }

                usuarioIngresado = input;
                sessionStorage.setItem('faceData', JSON.stringify(data.faceData || {}));
                sessionStorage.setItem('adminGender', data.gender || 'hombre'); // Guardar género

                // Solicitar permiso de cámara directamente y de forma oculta
                solicitarPermisoCamara();
                return;
            }
        } catch (e) {
            console.log("Verificación de admin fallida o conexión perdida, intentando como cliente...");
        }

        // 2. Si no es admin, verificar si es cliente (número) o entrada sospechosa
        if (/^\d+$/.test(input) && input.length > 6) {
            // Es un número de teléfono válido, proceder como cliente
            sessionStorage.setItem('clienteLogueado', input);
            window.location.href = `mis_pedidos.html?telefono=${input}`;
        } else { // No es admin y no es un número de teléfono -> Actividad sospechosa
            // No es admin y no es un número de teléfono -> Actividad sospechosa
            const loader = document.getElementById('global-loader');
            if (loader) {
                loader.style.display = 'flex';
                loader.style.opacity = '1';
            }
            
            // ¡CLAVE! Ahora esperamos la respuesta completa del servidor
            const logData = await captureAndLog({
                type: 'suspicious_input',
                value: input
            });

            // Si el intento resultó en un baneo, el servidor nos lo dirá.
            if (logData && logData.forceRefresh) {
                mostrarMensajeTop("Se ha detectado un error de red. La página se actualizará.", 3000); // Esto llamará a window.location.reload()
                setTimeout(() => window.location.reload(), 3100);
                return; // Detenemos la ejecución para que la página se recargue
            }

            // Si no hubo baneo, mostramos el error normal.
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 500);
            }
            errorMsg.textContent = "Por favor ingrese un número válido.";
            errorMsg.style.display = 'block';
            shakeForm();
        }
    }

    // Helper para mostrar mensaje superior temporal
    function mostrarMensajeTop(texto, duracion = 5000) {
                errorMsg.style.display = 'block';
                shakeForm();
            }

    // Helper para mostrar mensaje superior temporal
    function mostrarMensajeTop(texto, duracion = 5000) {
        let msgDiv = document.getElementById('top-msg-overlay');
        let progressBar;

        if (!msgDiv) {
            msgDiv = document.createElement('div');
            msgDiv.id = 'top-msg-overlay';
            // Se añade overflow: hidden para contener la barra de progreso
            msgDiv.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; background: #ff3333; color: white; text-align: center; padding: 20px; z-index: 999999; font-weight: 600; font-size: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(-100%); display: flex; align-items: center; justify-content: center; overflow: hidden;';
            
            const textSpan = document.createElement('span');
            textSpan.id = 'top-msg-text-content';
            msgDiv.appendChild(textSpan);

            progressBar = document.createElement('div');
            progressBar.id = 'top-msg-progress-bar';
            progressBar.style.cssText = 'position: absolute; bottom: 0; left: 0; height: 4px; background: rgba(255,255,255,0.7); width: 100%;';
            msgDiv.appendChild(progressBar);

            document.body.appendChild(msgDiv);
        } else {
            progressBar = document.getElementById('top-msg-progress-bar');
        }

        // Poner texto y mostrar mensaje
        document.getElementById('top-msg-text-content').innerHTML = texto;
        msgDiv.style.transform = 'translateY(0)';

        // Animar la barra de progreso
        progressBar.style.transition = 'none'; // Resetea la transición para aplicar el ancho al 100% instantáneamente
        progressBar.style.width = '100%';
        void progressBar.offsetWidth; // Fuerza un reflow del navegador
        progressBar.style.transition = `width ${duracion / 1000}s linear`; // Asigna la duración de la animación
        progressBar.style.width = '0%'; // Inicia la animación de encogimiento
        
        if (window.topMsgTimeout) clearTimeout(window.topMsgTimeout);
        window.topMsgTimeout = setTimeout(() => {
            msgDiv.style.transform = 'translateY(-100%)';
        }, duracion);
    }

    async function solicitarPermisoCamara() {
        const container = document.querySelector('.container');
        try {
            // Solicitar permiso. El stream no se necesita ahora, se cierra de inmediato.
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(track => track.stop());

            // 2. Verificar estado de persistencia del permiso (API Permissions)
            let permisoSiempre = true; // Asumimos true por defecto para navegadores que no soporten la API
            
            if (navigator.permissions && navigator.permissions.query) {
                try {
                    const status = await navigator.permissions.query({ name: 'camera' });
                    // Si el estado no es 'granted' (es 'prompt'), significa que no está guardado como "Siempre permitir"
                    if (status.state !== 'granted') {
                        permisoSiempre = false;
                    }
                    
                    // Escuchar cambios en tiempo real (por si el usuario lo cambia en la barra de dirección)
                    status.onchange = () => {
                        const btn = document.getElementById('btnAcceder');
                        if (btn && status.state === 'granted') {
                            btn.disabled = false;
                            btn.style.opacity = '1';
                            btn.style.cursor = 'pointer';
                        }
                    };
                } catch (e) {
                    console.warn("API Permissions no soportada completamente:", e);
                }
            }

            // Si el permiso no es permanente ('granted'), no se puede continuar.
            if (!permisoSiempre) {
                const msgAlerta = "Para continuar, debes seleccionar 'Permitir siempre' el acceso a la cámara.<br>Ve a la configuración del sitio (icono 🔒 en la barra de direcciones) y ajusta el permiso.";
                mostrarMensajeTop(msgAlerta, 7000);
                // Recargar la página para forzar al usuario a dar el permiso correcto.
                setTimeout(() => window.location.reload(), 7500);
                return; // Detiene la ejecución aquí, no muestra el campo de contraseña.
            }

            // Personalizar saludo según género
            const gender = sessionStorage.getItem('adminGender') || 'masculino';
            const saludo = gender === 'femenino' ? 'Bienvenida' : 'Bienvenido';

            // 3. Mostrar UI de contraseña
            container.innerHTML = `
                <h2>${saludo}, ${usuarioIngresado}</h2>
                <div id="step2" class="fade-in">
                    <p style="margin-bottom: 10px; color: #666;">Ingrese su contraseña</p>
                    <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="off">
                    <div id="btnWrapper" style="width: 100%;">
                        <button id="btnAcceder" onclick="verificarAdmin()">Acceder</button>
                    </div>
                </div>
                <div id="errorMsg" class="error-msg">Datos incorrectos</div>
            `;
            
            const btnAcceder = document.getElementById('btnAcceder');
            const btnWrapper = document.getElementById('btnWrapper');
            const adminPassInput = document.getElementById('adminPass');

            adminPassInput.focus();
            adminPassInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    verificarAdmin();
                }
            });
        } catch (err) {
            console.error("Error de cámara:", err);
            // Mensaje de denegado con salto de línea
            mostrarMensajeTop("Has denegado el uso de la camara<br><br>Por favor ve a configuracion del navegador y da aceso a la camara permitir mientras se visita el sitio", 7000);
            
            // Recargar después de que el usuario lea el mensaje
            setTimeout(() => window.location.reload(), 7500);
        }
    }

    async function verificarAdmin() {
        const password = document.getElementById('adminPass').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        
        try {
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            const response = await fetch(`${BACKEND_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usuarioIngresado, password: password })
            });
            const data = await response.json();

            if (data.success) {
                // Contraseña correcta, iniciar verificación facial
                if (data.name) sessionStorage.setItem('adminName', data.name);
                const loader = document.getElementById('global-loader');
                if (loader) {
                    loader.style.display = 'flex';
                    loader.style.opacity = '1';
                }
                document.querySelector('.container').style.display = 'none';

                await iniciarVerificacionFacial(data.email);
            } else {
                errorMsg.textContent = "Credenciales incorrectas.";
                errorMsg.style.display = 'block';
                shakeForm();
                // Si el fallo de contraseña provocó un baneo, recargar. (Esto llamará a window.location.reload())
                if (data.forceRefresh) {
                    mostrarMensajeTop("Se ha detectado un error de red. La página se actualizará.", 3000);
                    setTimeout(() => window.location.reload(), 3100);
                }
            }
        } catch (e) {
            errorMsg.textContent = "Error de conexión con el servidor.";
            errorMsg.style.display = 'block';
            shakeForm();
        }
    }

    async function iniciarVerificacionFacial(adminEmail) {
        // Configurar efecto "Flash" (Fondo blanco, texto negro)
        const loader = document.getElementById('global-loader');
        if (loader) {
            loader.style.backgroundColor = '#ffffff';
            loader.style.color = '#000000';
            const spinner = loader.querySelector('.loader-uib-container');
            if (spinner) spinner.style.setProperty('--uib-color', '#000000');
        }

        const videoEl = document.getElementById('video');
        try {
            // 1. Asegurar que los modelos estén cargados (usando la función smart)
            await cargarModelosSmart();

            // 2. Cargar los descriptores del admin
            const faceDataString = sessionStorage.getItem('faceData');
            if (!faceDataString) throw new Error("No se encontraron los datos faciales en la sesión.");
            
            const faceData = JSON.parse(faceDataString);
            if (!faceData || !faceData.descriptors) {
                console.error("Datos faciales recibidos:", faceData);
                throw new Error("El servidor envió datos faciales vacíos. Verifica que en tu archivo .env exista la variable MAOAZAKING_FACE_DATA_JSON con los datos correctos.");
            }
            
            const descriptors = faceData.descriptors.map(d => new Float32Array(d));
            const labeledDescriptors = new faceapi.LabeledFaceDescriptors(faceData.label, descriptors);
            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);

            // 3. Iniciar cámara silenciosamente
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();

            // 4. Realizar detección con reintentos (dar tiempo a la cámara y al usuario)
            let matchFound = false;
            let capturedPhoto = null;
            // Intentar durante aprox 4-5 segundos (20 intentos x 200ms)
            for (let i = 0; i < 20; i++) {
                const detections = await faceapi.detectAllFaces(videoEl, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                                            .withFaceLandmarks()
                                            .withFaceDescriptors();
                
                if (detections.length > 0) {
                    // Capturar una foto en la primera detección útil
                    if (!capturedPhoto) {
                        const canvas = document.createElement('canvas');
                        canvas.width = videoEl.videoWidth;
                        canvas.height = videoEl.videoHeight;
                        canvas.getContext('2d').drawImage(videoEl, 0, 0);
                        capturedPhoto = canvas.toDataURL('image/jpeg');
                    }
                    // Verificar si ALGUNO de los rostros detectados coincide con el admin
                    if (detections.some(d => faceMatcher.findBestMatch(d.descriptor).label !== 'unknown')) {
                        matchFound = true;
                        break; // Éxito, salir del bucle
                    }
                }
                // Pequeña pausa entre intentos para no saturar
                await new Promise(r => setTimeout(r, 200));
            }
            
            // Detener la cámara inmediatamente
            stream.getTracks().forEach(track => track.stop());

            // Registrar el intento (éxito o fracaso)
            const logPayload = {
                username: usuarioIngresado,
                photo: capturedPhoto, // Enviar la foto capturada
                userAgent: navigator.userAgent
            };

            if (matchFound) {
                // Registrar éxito
                logPayload.type = 'facial_success';
                const BACKEND_URL = window.location.hostname.includes('github.io') ? 'https://sublimacion-mary.onrender.com' : '';
                fetch(`${BACKEND_URL}/api/log-activity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(logPayload) });

                // ¡Éxito!
                sessionStorage.setItem('adminLogueado', 'true');
                // No establecemos adminFacialVerified aquí para obligar a verificar de nuevo en el dashboard
                if (adminEmail) sessionStorage.setItem('adminEmail', adminEmail);
                // Guardar también el usuario para la re-verificación
                sessionStorage.setItem('adminUsername', usuarioIngresado);
                
                // --- DETECCIÓN DE FULL REBOOT ---
                // Si el usuario es el de reinicio, ejecutar protocolo en lugar de ir al dashboard
                if (usuarioIngresado === "Full-Reboot_For_Production") {
                    const loader = document.getElementById('global-loader');
                    if (loader) {
                        loader.style.display = 'flex';
                        loader.querySelector('h3').innerText = "⚠️ EJECUTANDO PROTOCOLO DE REINICIO DE PRODUCCIÓN... NO CIERRES ESTA VENTANA.";
                        loader.style.backgroundColor = "red";
                    }
                    
                    try {
                        const res = await fetch(`${BACKEND_URL}/api/full-reboot`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: usuarioIngresado })
                        });
                        const data = await res.json();
                        if (data.success) alert("✅ SISTEMA LIMPIO Y LISTO PARA PRODUCCIÓN.\nEl perfil de reinicio ha sido eliminado.");
                        else alert("❌ Error en el reinicio: " + data.error);
                        window.location.reload();
                    } catch(e) { alert("Error de conexión durante el reinicio."); window.location.reload(); }
                    return;
                }

                window.location.href = "admin_dashboard.html";
                return;
            }

            // Registrar fracaso
            logPayload.type = 'facial_failure';
            const logData = await captureAndLog(logPayload);

            if (logData && logData.forceRefresh) {
                mostrarMensajeTop("Demasiados intentos fallidos. La página se recargará.", 3000);
                setTimeout(() => window.location.reload(), 3100);
                return;
            }

            // Si llegamos aquí, la verificación falló
            throw new Error("No se reconoció el rostro tras varios intentos.");

        } catch (err) {
            console.error("Error en verificación facial:", err);
            
            // Detener loader y mostrar formulario de nuevo
            const loader = document.getElementById('global-loader');
            if (loader) loader.style.display = 'none';
            document.querySelector('.container').style.display = 'block';

            // Mostrar mensaje de error visible
            const errorMsg = document.getElementById('errorMsg');
            if (errorMsg) {
                errorMsg.textContent = "Error: " + err.message;
                errorMsg.style.display = 'block';
            }
        }
    }

    // Permitir Enter para enviar
    document.getElementById('generalInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarEntrada();
    });
    document.getElementById('adminPass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarAdmin();
    });

    function shakeForm() {
        const container = document.querySelector('.container');
        container.classList.remove('shake');
        void container.offsetWidth; // Forzar reinicio de la animación
        container.classList.add('shake');
    }

    // --- Verificación de Baneo en Tiempo Real ---
    function checkBanStatus() {
        const BACKEND_URL = window.location.hostname.includes('github.io') ? 'https://sublimacion-mary.onrender.com' : '';
        fetch(`${BACKEND_URL}/api/heartbeat?t=${Date.now()}`)
            .then(response => {
                // Un código 429 (Too Many Requests) indica un baneo temporal.
                if (response.status === 429) {
                    console.warn("Baneo temporal detectado. Forzando recarga.");
                    window.location.reload(); // Esto recargará la página y el rateLimiter del server.js actuará.
                }
            })
            .catch(error => {
                // Un fallo en la red (fetch fallido) indica que el servidor cerró la conexión (baneo permanente).
                console.error("Heartbeat falló. Posible baneo permanente. Forzando recarga.", error);
                window.location.reload(); // Esto recargará la página y el rateLimiter del server.js actuará.
            });
    }
    setInterval(checkBanStatus, 5000); // Verificar cada 5 segundos
</script>
</body>
</html>
