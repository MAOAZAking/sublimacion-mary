<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bienvenido - Sublimación Mary</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; margin: 0; color: white; }
        .container { background: #1e1e1e; padding: 3rem 2rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; transition: transform 0.3s; border: 1px solid #333; }
        .container:hover { transform: translateY(-5px); }
        h2 { color: rgb(255, 255, 255); margin-bottom: 2rem; font-weight: 600; letter-spacing: -0.5px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #333; background: #2d2d2d; color: white; border-radius: 12px; font-size: 1rem; box-sizing: border-box; text-align: center; transition: all 0.3s; font-family: inherit; -webkit-appearance: none; }
        input:focus { border-color: #8e44ad; background: #333; outline: none; box-shadow: 0 0 0 4px rgba(142, 68, 173, 0.2); }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, rgb(213, 0, 249), rgb(192, 0, 224)); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s; box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3); -webkit-appearance: none; }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(192, 0, 224, 0.4); }
        button:active { transform: translateY(0); }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .error-msg { color: red; font-size: 0.9rem; margin-top: 10px; display: none; }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-15px); }
            80% { transform: translateX(15px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.5s ease-in-out; }

        /* Loader Styles */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #333; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.5s ease;
        }
        .loader-uib-container {
            --uib-size: 45px;
            --uib-color: white;
            --uib-speed: 2.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--uib-size);
            width: var(--uib-size);
        }
        .slice {
            position: relative;
            height: calc(var(--uib-size) / 6);
            width: 100%;
        }
        .slice::before, .slice::after {
            --uib-a: calc(var(--uib-speed) / -2);
            --uib-b: calc(var(--uib-speed) / -6);
            content: '';
            position: absolute;
            top: 0;
            left: calc(50% - var(--uib-size) / 12);
            height: 100%;
            width: calc(100% / 6);
            border-radius: 50%;
            background-color: var(--uib-color);
            flex-shrink: 0;
            animation: orbit var(--uib-speed) linear infinite;
            transition: background-color 0.3s ease;
        }
        .slice:nth-child(1)::after { animation-delay: var(--uib-a); }
        .slice:nth-child(2)::before { animation-delay: var(--uib-b); }
        .slice:nth-child(2)::after { animation-delay: calc(var(--uib-a) + var(--uib-b)); }
        .slice:nth-child(3)::before { animation-delay: calc(var(--uib-b) * 2); }
        .slice:nth-child(3)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 2); }
        .slice:nth-child(4)::before { animation-delay: calc(var(--uib-b) * 3); }
        .slice:nth-child(4)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 3); }
        .slice:nth-child(5)::before { animation-delay: calc(var(--uib-b) * 4); }
        .slice:nth-child(5)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 4); }
        .slice:nth-child(6)::before { animation-delay: calc(var(--uib-b) * 5); }
        .slice:nth-child(6)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 5); }
        @keyframes orbit {
            0% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
            5% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.684208); opacity: 0.58; }
            10% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.631576); opacity: 0.51; }
            15% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.578944); opacity: 0.44; }
            20% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.526312); opacity: 0.37; }
            25% { transform: translateX(0%) scale(0.47368); opacity: 0.3; }
            30% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.526312); opacity: 0.37; }
            35% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.578944); opacity: 0.44; }
            40% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.631576); opacity: 0.51; }
            45% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.684208); opacity: 0.58; }
            50% { transform: translateX(calc(var(--uib-size) * -0.25)) scale(0.73684); opacity: 0.65; }
            55% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.789472); opacity: 0.72; }
            60% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.842104); opacity: 0.79; }
            65% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.894736); opacity: 0.86; }
            70% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.947368); opacity: 0.93; }
            75% { transform: translateX(0%) scale(1); opacity: 1; }
            80% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.947368); opacity: 0.93; }
            85% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.894736); opacity: 0.86; }
            90% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.842104); opacity: 0.79; }
            95% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.789472); opacity: 0.72; }
            100% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
        }
        /* Background Logo */
        #background-logo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
            background-image: url('https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png');
            background-position: center; background-repeat: no-repeat;
            opacity: 0.1;
        }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-uib-container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
    <h3 style="margin: 20px 20px 0; text-align: center;">Estamos preparando ¡LA MEJOR EXPERIENCIA PARA TI!</h3>
</div>

<div class="container">
    <h2>Para ver tu producto ingresa tu número de celular</h2>
    
    <!-- Paso 1: Entrada General (Teléfono o Contraseña) -->
    <div id="step1">
        <input type="text" id="generalInput" placeholder="Ingrese su número celular" autocomplete="off">
        <button onclick="verificarEntrada()">Continuar</button>
    </div>

    <!-- Paso 2: Solo para Admins (Contraseña) -->
    <div id="step2" class="hidden fade-in">
        <p style="margin-bottom: 10px; color: #666;">Ingrese su contraseña</p>
        <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="off">
        <button onclick="verificarAdmin()">Acceder</button>
    </div>

    <div id="errorMsg" class="error-msg">Datos incorrectos</div>
</div>

<video id="video" playsinline style="display: none;"></video>

<script>
    let usuarioIngresado = "";

    window.addEventListener('load', function() {
        const loader = document.getElementById('global-loader');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }

        // Lógica del Logo de Fondo
        const bg = document.createElement('div');
        bg.id = 'background-logo';
        document.body.prepend(bg);

        function updateBg() {
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || window.innerWidth < 768;
            if (isMobile) {
                if (window.innerHeight > window.innerWidth) {
                    bg.style.backgroundSize = "60vw auto"; // Vertical: 60% del ancho
                } else {
                    bg.style.backgroundSize = "auto 60vh"; // Horizontal: 60% del alto
                }
            } else {
                bg.style.backgroundSize = "auto 85vh"; // Escritorio: 85% del alto
            }
        }
        updateBg();

        if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || window.innerWidth < 768) {
            setInterval(updateBg, 1000); // Móvil: Actualizar cada segundo
        } else {
            window.addEventListener('resize', updateBg); // Escritorio: Solo al redimensionar
        }
    });

    async function verificarEntrada() {
        const input = document.getElementById('generalInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.style.display = 'none';

        if (!input) {
            shakeForm();
            return;
        }

        // 1. Verificar si es un Usuario de Admin
        // Validación segura consultando al servidor
        try {
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            const response = await fetch(`${BACKEND_URL}/api/check-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: input })
            });
            const data = await response.json();
            if (data.isAdmin) {
                // CASO ESPECIAL: Admin sin contraseña (Majo primera vez)
                if (data.isSetupRequired) {
                    sessionStorage.setItem('adminLogueado', 'true');
                    sessionStorage.setItem('currentUser', input); // Guardar usuario para usarlo después
                    if (data.email) sessionStorage.setItem('adminEmail', data.email);
                    if (data.faceData) {
                        sessionStorage.setItem('faceData', JSON.stringify(data.faceData));
                    }
                    window.location.href = data.redirectUrl || 'bienvenida_majo.html';
                    return;
                }

                usuarioIngresado = input;
                sessionStorage.setItem('faceData', JSON.stringify(data.faceData || {}));
                // Solicitar permiso de cámara directamente y de forma oculta
                solicitarPermisoCamara();
                return;
            }
        } catch (e) {
            console.log("Verificación de admin fallida o conexión perdida, intentando como cliente...");
        }

        // Si no es admin, continuamos con la lógica de cliente
        {
            // 2. Asumir que es un cliente (Número telefónico)
            // Validación simple de números
            if (/^\d+$/.test(input) && input.length > 6) {
                // Guardar sesión del cliente
                sessionStorage.setItem('clienteLogueado', input);
                // Redireccionar a la vista de cliente
                window.location.href = `mis_pedidos.html?telefono=${input}`;
            } else {
                errorMsg.textContent = "Por favor ingrese un número válido.";
                errorMsg.style.display = 'block';
                shakeForm();
            }
        }
    }

    async function solicitarPermisoCamara() {
        const container = document.querySelector('.container');
        try {
            // Solicitar permiso. El stream no se necesita ahora, se cierra de inmediato.
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            stream.getTracks().forEach(track => track.stop());

            // Si el permiso se concede, mostrar el campo de contraseña.
            container.innerHTML = `
                <h2>Bienvenido, ${usuarioIngresado}</h2>
                <div id="step2" class="fade-in">
                    <p style="margin-bottom: 10px; color: #666;">Ingrese su contraseña</p>
                    <input type="password" id="adminPass" placeholder="Contraseña" autocomplete="off">
                    <button onclick="verificarAdmin()">Acceder</button>
                </div>
                <div id="errorMsg" class="error-msg">Datos incorrectos</div>
            `;
            const adminPassInput = document.getElementById('adminPass');
            adminPassInput.focus();
            adminPassInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') verificarAdmin();
            });
        } catch (err) {
            console.error("Error de cámara:", err);
            // Si se niega el permiso, refrescar la página para volver a intentarlo en un bucle.
            window.location.reload();
        }
    }

    async function verificarAdmin() {
        const password = document.getElementById('adminPass').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        
        try {
            const BACKEND_URL = window.location.hostname.includes('github.io') 
                ? 'https://sublimacion-mary.onrender.com' 
                : '';

            const response = await fetch(`${BACKEND_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usuarioIngresado, password: password })
            });
            const data = await response.json();

            if (data.success) {
                // Contraseña correcta, iniciar verificación facial
                const loader = document.getElementById('global-loader');
                if (loader) {
                    loader.style.display = 'flex';
                    loader.style.opacity = '1';
                }
                document.querySelector('.container').style.display = 'none';

                await iniciarVerificacionFacial(data.email);
            } else {
                errorMsg.textContent = "Credenciales incorrectas.";
                errorMsg.style.display = 'block';
                shakeForm();
            }
        } catch (e) {
            errorMsg.textContent = "Error de conexión con el servidor.";
            errorMsg.style.display = 'block';
            shakeForm();
        }
    }

    async function iniciarVerificacionFacial(adminEmail) {
        const videoEl = document.getElementById('video');
        try {
            // 1. Cargar modelos de face-api
            await Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri('models_rf'),
                faceapi.nets.faceLandmark68Net.loadFromUri('models_rf'),
                faceapi.nets.faceRecognitionNet.loadFromUri('models_rf')
            ]);

            // 2. Cargar los descriptores del admin
            const faceDataString = sessionStorage.getItem('faceData');
            if (!faceDataString) throw new Error("No se encontraron los datos faciales en la sesión.");
            
            const faceData = JSON.parse(faceDataString);
            if (!faceData || !faceData.descriptors) throw new Error("");
            
            const descriptors = faceData.descriptors.map(d => new Float32Array(d));
            const labeledDescriptors = new faceapi.LabeledFaceDescriptors(faceData.label, descriptors);
            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);

            // 3. Iniciar cámara silenciosamente
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();

            // 4. Realizar una única detección
            const detection = await faceapi.detectSingleFace(videoEl, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                                         .withFaceLandmarks()
                                         .withFaceDescriptor();
            
            // Detener la cámara inmediatamente
            stream.getTracks().forEach(track => track.stop());

            if (detection) {
                const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                if (bestMatch.label !== 'unknown') {
                    // ¡Éxito!
                    sessionStorage.setItem('adminLogueado', 'true');
                    if (adminEmail) sessionStorage.setItem('adminEmail', adminEmail);
                    // Guardar también el usuario para la re-verificación
                    sessionStorage.setItem('adminUsername', usuarioIngresado);
                    window.location.href = "admin_dashboard.html";
                    return;
                }
            }

            // Si llegamos aquí, la verificación falló
            throw new Error("");

        } catch (err) {
            console.error(err);
            window.location.reload();
        }
    }

    // Permitir Enter para enviar
    document.getElementById('generalInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarEntrada();
    });
    document.getElementById('adminPass').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verificarAdmin();
    });

    function shakeForm() {
        const container = document.querySelector('.container');
        container.classList.remove('shake');
        void container.offsetWidth; // Forzar reinicio de la animación
        container.classList.add('shake');
    }
</script>

</body>
</html>
