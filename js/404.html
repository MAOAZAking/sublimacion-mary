<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; text-align: center; }
        .container { background: #1e1e1e; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #333; max-width: 450px; }
        .logo { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(213, 0, 249, 0.3)); }
        h1 { font-size: 6rem; margin: 0; background: linear-gradient(135deg, rgb(213, 0, 249), rgb(192, 0, 224)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        h2 { margin-top: 0; font-weight: 400; color: #aaa; }
        p { color: #888; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 15px 35px; background: linear-gradient(135deg, rgb(213, 0, 249), rgb(192, 0, 224)); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; transition: all 0.3s; box-shadow: 0 10px 20px rgba(142, 68, 173, 0.3); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(192, 0, 224, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" alt="Logo" class="logo">
        <h1>404</h1>
        <h2>¡Ups! Te has perdido</h2>
        <p>Parece que el diseño que buscas no está en nuestra estantería o el enlace ha caducado.</p>
        <a href="/" class="btn">Volver al Inicio</a>
    </div>
</body>
</html>
