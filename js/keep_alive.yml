name: Server Keep-Alive

on:
  schedule:
    # Ejecutar cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Sublimación Mary Server
        run: |
          # Hacemos una solicitud muy ligera al heartbeat
          curl -s -o /dev/null -w "%{http_code}" https://sublimacion-mary.onrender.com/api/heartbeat
          echo "Ping enviado exitosamente."