        .btn-finish-mode.active { background: linear-gradient(135deg, #5ad68a9e, #52c27b9e); box-shadow: inset 0 3px 5px rgba(0,0,0,0.5); transform: none; border: 1px solid #555; }

        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(142, 68, 173, 0.6); }

        /* Loader Styles */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #333; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.5s ease;
        }
        .loader-uib-container {
            --uib-size: 45px;
            --uib-color: white;
            --uib-speed: 2.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--uib-size);
            width: var(--uib-size);
        }
        .slice {
            position: relative;
            height: calc(var(--uib-size) / 6);
            width: 100%;
        }
        .slice::before, .slice::after {
            --uib-a: calc(var(--uib-speed) / -2);
            --uib-b: calc(var(--uib-speed) / -6);
            content: '';
            position: absolute;
            top: 0;
            left: calc(50% - var(--uib-size) / 12);
            height: 100%;
            width: calc(100% / 6);
            border-radius: 50%;
            background-color: var(--uib-color);
            flex-shrink: 0;
            animation: orbit var(--uib-speed) linear infinite;
            transition: background-color 0.3s ease;
        }
        .slice:nth-child(1)::after { animation-delay: var(--uib-a); }
        .slice:nth-child(2)::before { animation-delay: var(--uib-b); }
        .slice:nth-child(2)::after { animation-delay: calc(var(--uib-a) + var(--uib-b)); }
        .slice:nth-child(3)::before { animation-delay: calc(var(--uib-b) * 2); }
        .slice:nth-child(3)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 2); }
        .slice:nth-child(4)::before { animation-delay: calc(var(--uib-b) * 3); }
        .slice:nth-child(4)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 3); }
        .slice:nth-child(5)::before { animation-delay: calc(var(--uib-b) * 4); }
        .slice:nth-child(5)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 4); }
        .slice:nth-child(6)::before { animation-delay: calc(var(--uib-b) * 5); }
        .slice:nth-child(6)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 5); }
        @keyframes orbit {
            0% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
            5% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.684208); opacity: 0.58; }
            10% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.631576); opacity: 0.51; }
            15% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.578944); opacity: 0.44; }
            20% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.526312); opacity: 0.37; }
            25% { transform: translateX(0%) scale(0.47368); opacity: 0.3; }
            30% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.526312); opacity: 0.37; }
            35% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.578944); opacity: 0.44; }
            40% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.631576); opacity: 0.51; }
            45% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.684208); opacity: 0.58; }
            50% { transform: translateX(calc(var(--uib-size) * -0.25)) scale(0.73684); opacity: 0.65; }
            55% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.789472); opacity: 0.72; }
            60% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.842104); opacity: 0.79; }
            65% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.894736); opacity: 0.86; }
            70% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.947368); opacity: 0.93; }
            75% { transform: translateX(0%) scale(1); opacity: 1; }
            80% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.947368); opacity: 0.93; }
            85% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.894736); opacity: 0.86; }
            90% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.842104); opacity: 0.79; }
            95% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.789472); opacity: 0.72; }
            100% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
        }
        /* Background Logo */
        #background-logo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
            background-image: url('https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png');
            background-position: center; background-repeat: no-repeat;
            opacity: 0.1;

    </style>
</head>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from './js/OrbitControls.js';
    import { GLTFLoader } from './js/GLTFLoader.js';

    let todosLosPedidos = []; 
    let pedidosFiltrados = []; 
    let isEditMode = false; 
    let isFinishMode = false;
    let currentSortField = 'estado'; // Valor inicial cambiado a 'estado'
    let isSortAscending = true; // Valor inicial cambiado a true (ascendente por prioridad/fecha)
    let currentDownloadUrl = '';
    let isInternalNavigation = false; // Bandera para controlar la navegación interna
    let renderer, scene, camera, controls, animationId;
    const videoEl = document.querySelector('#video');

    // Función inteligente para cargar modelos
    async function cargarModelosSmart() {
        const MODEL_URL = 'models_rf';
        try {
            if (typeof faceapi === 'undefined') return;
            
            const models = [
                faceapi.nets.ssdMobilenetv1,
                faceapi.nets.faceLandmark68Net,
                faceapi.nets.faceRecognitionNet
            ];
            
            await Promise.all(models.map(net => net.isLoaded ? Promise.resolve() : net.loadFromUri(MODEL_URL)));
            console.log("Modelos de reconocimiento facial listos.");
        } catch (e) {
            console.error("Error cargando modelos:", e);
        }
    }

    window.addEventListener('load', function() {
        // Configurar efecto "Flash" y mensaje personalizado
        const loader = document.getElementById('global-loader');
        if (loader) {
            // Clonamos el loader para cancelar la animación de ocultado automática de global.js
            const newLoader = loader.cloneNode(true);
            loader.parentNode.replaceChild(newLoader, loader);
            
            newLoader.style.display = 'flex';
            newLoader.style.opacity = '1';
            newLoader.style.backgroundColor = '#ffffff';
            newLoader.style.color = '#000000';
            const spinner = newLoader.querySelector('.loader-uib-container');
            if (spinner) spinner.style.setProperty('--uib-color', '#000000');
            
            const loaderText = document.getElementById('loader-text');
            if (loaderText) loaderText.innerText = "Ya casi terminamos, espera un momento más";
        }

        // VERIFICACIÓN POR TOKEN DE NAVEGACIÓN INTERNA (Nuevo/Editar Pedido)
        // Si venimos de una página interna segura, validamos sin reconocimiento facial
        if (sessionStorage.getItem('safeNavigationToken') === 'true') {
            sessionStorage.removeItem('safeNavigationToken'); // Eliminar token inmediatamente (un solo uso)
            sessionStorage.setItem('adminFacialVerified', 'true'); // Marcar sesión como verificada
        }

        // El loader ya está visible. Iniciamos la re-verificación facial.
        // El loader ya está visible.
        document.documentElement.style.display = 'block'; // Mostramos el body para que el loader sea visible
        reverificarIdentidad();

        // Verificar si ya se realizó la validación facial en esta sesión
        if (sessionStorage.getItem('adminFacialVerified') === 'true') {
            const loaderText = document.getElementById('loader-text');
            if (loaderText) loaderText.innerText = "Sesión verificada. Cargando panel...";
            inicializarDashboard();
        } else {
            const loaderText = document.getElementById('loader-text');
            if (loaderText) loaderText.innerText = "Ya esta terminando la carga, por favor espera...";
            reverificarIdentidad();
        }

        // --- LÓGICA DE INACTIVIDAD ROBUSTA ---
        const INACTIVITY_LIMIT = 5 * 60 * 1000; // 5 minutos

        function updateActivity() {
            sessionStorage.setItem('adminLastActivity', Date.now().toString());
        }

        function checkInactivity() {
            const lastActivity = parseInt(sessionStorage.getItem('adminLastActivity') || Date.now());
            if (Date.now() - lastActivity > INACTIVITY_LIMIT) {
                cerrarSesion("Sesión cerrada por inactividad.");
            }
        }

        // Eventos que reinician el temporizador
        ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => 
            document.addEventListener(evt, updateActivity, false)
        );

        // Chequeo periódico (cada 10s) para detectar inactividad incluso si la pestaña está en segundo plano
        setInterval(checkInactivity, 10000);
        
        // Chequeo inmediato al volver al foco
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkInactivity();
        });

        updateActivity(); // Iniciar contador

        // Lógica del Logo de Fondo
        const bg = document.createElement('div');
        bg.id = 'background-logo';
        document.body.prepend(bg);

        function updateBg() {
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || window.innerWidth < 768;
            if (isMobile) {
                if (window.innerHeight > window.innerWidth) {
                    bg.style.backgroundSize = "90vw auto"; // Vertical: 90% del ancho
                } else {
                    bg.style.backgroundSize = "auto 90vh"; // Horizontal: 90% del alto
                }
            } else {
                bg.style.backgroundSize = "auto 90vh"; // Escritorio: 90% del alto
            }
        }
        updateBg();

        if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || window.innerWidth < 768) {
            setInterval(updateBg, 1000); // Móvil: Actualizar cada segundo
        } else {
            window.addEventListener('resize', updateBg); // Escritorio: Solo al redimensionar
        }
    });

    async function captureAndLogReauth(payload) {
        let photo = null;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();
            
            await new Promise(r => setTimeout(r, 500));

            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth;
            canvas.height = videoEl.videoHeight;
            canvas.getContext('2d').drawImage(videoEl, 0, 0);
            photo = canvas.toDataURL('image/jpeg');

            stream.getTracks().forEach(track => track.stop());
        } catch (err) { console.error("Error capturando foto de re-autenticación:", err); }

        payload.photo = photo;
        payload.userAgent = navigator.userAgent;
        const BACKEND_URL = window.location.hostname.includes('github.io') ? 'https://sublimacion-mary.onrender.com' : '';
        try {
            const response = await fetch(`${BACKEND_URL}/api/log-activity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            return await response.json();
        } catch (err) {
            console.error('Fallo al registrar actividad:', err);
            return { success: false };
        }
    }

    async function reverificarIdentidad() {
        const loaderText = document.getElementById('loader-text');
        // El texto por defecto del loader es "Estamos preparando...", que es el deseado.
        try {
            // 1. Cargar modelos (Smart Load)
            await cargarModelosSmart();

             // 2. Cargar descriptores desde sessionStorage (puestos ahí por la página de login)
            const faceDataString = sessionStorage.getItem('faceData');
            if (!faceDataString) throw new Error("No se encontraron los datos faciales en la sesión.");

            const faceData = JSON.parse(faceDataString);
            if (!faceData || !faceData.descriptors) {
                console.error("Datos faciales en dashboard:", faceData);
                throw new Error("Datos faciales inválidos o corruptos. Revisa la configuración del servidor.");
            }
            
            const descriptors = faceData.descriptors.map(d => new Float32Array(d));
            const labeledDescriptors = new faceapi.LabeledFaceDescriptors(faceData.label, descriptors);
            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);

            // 3. Iniciar cámara silenciosamente
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();

            // 4. Realizar detección con reintentos
            let matchFound = false;
            let capturedPhoto = null;
            for (let i = 0; i < 20; i++) {
                const detections = await faceapi.detectAllFaces(videoEl, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
                                            .withFaceLandmarks()
                                            .withFaceDescriptors();
                
                if (detections.length > 0) {
                    if (!capturedPhoto) {
                        const canvas = document.createElement('canvas');
                        canvas.width = videoEl.videoWidth;
                        canvas.height = videoEl.videoHeight;
                        canvas.getContext('2d').drawImage(videoEl, 0, 0);
                        capturedPhoto = canvas.toDataURL('image/jpeg');
                    }

                    if (detections.some(d => faceMatcher.findBestMatch(d.descriptor).label !== 'unknown')) {
                        matchFound = true;
                        break;
                    }
                }
                await new Promise(r => setTimeout(r, 200));
            }
            
            stream.getTracks().forEach(track => track.stop());

            const username = sessionStorage.getItem('adminUsername');
            const logPayload = { username: username, photo: capturedPhoto, userAgent: navigator.userAgent };

            if (matchFound) {
                // Registrar éxito de re-autenticación
                logPayload.type = 'reauth_success';
                const BACKEND_URL = window.location.hostname.includes('github.io') ? 'https://sublimacion-mary.onrender.com' : '';
                fetch(`${BACKEND_URL}/api/log-activity`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(logPayload) });

                // ¡Éxito! Iniciar el dashboard
                sessionStorage.setItem('adminFacialVerified', 'true'); // Crear token para esta sesión
                const gender = sessionStorage.getItem('adminGender') || 'hombre';
                const saludo = gender === 'mujer' ? '¡Bienvenida de nuevo!' : '¡Bienvenido de nuevo!';
                
                loaderText.innerText = `${saludo} Cargando panel...`;
                inicializarDashboard();
                return;
            }

            // Registrar fallo de re-autenticación
            logPayload.type = 'reauth_failure';
            const logData = await captureAndLogReauth(logPayload);

            if (logData && logData.forceRefresh) {
                cerrarSesion("Demasiados intentos fallidos. Se ha cerrado la sesión por seguridad.");
                return;
            }

            // Si llegamos aquí, la verificación falló
            throw new Error("Rostro no reconocido tras varios intentos.");

        } catch (err) {
            console.error("Error en re-verificación facial:", err);
            
            // Mostrar error en el loader en lugar de redirigir
            const loader = document.getElementById('global-loader');
            const loaderText = document.getElementById('loader-text');
            const spinner = document.querySelector('.loader-uib-container');
            
            if (loader && loaderText) {
                loader.style.backgroundColor = '#000000'; // Fondo negro para leer mejor
                loader.style.color = '#ffffff';
                if (spinner) spinner.style.display = 'none'; // Ocultar animación
                
                loaderText.innerHTML = `
                    <div style="color: #ff4444; margin-bottom: 20px; font-weight:bold;">Error: ${err.message}</div>
                    <div style="font-size: 0.9rem; color: #ccc; margin-bottom: 20px;">Si estás en local, verifica que tu cámara tenga permisos y el archivo .env esté bien cargado.</div>
                    <button onclick="window.location.reload()" style="padding: 10px 25px; border-radius: 50px; border: none; background: white; color: black; font-weight: bold; cursor: pointer; font-size: 1rem;">Reintentar</button>
                    <br><br>
                    <button onclick="cerrarSesion()" style="background: none; border: 1px solid #666; color: #888; padding: 5px 15px; border-radius: 50px; cursor: pointer;">Cerrar Sesión</button>
                `;
            } else {
                alert("Error crítico: " + err.message);
            }
        }
    }

    function aplicarOrdenamiento() {
        // Convertir "DD/MM/YYYY HH:mm:ss" a Date object
        const parseDate = (str) => {
            if (!str) return 0;
            const [date, time] = str.split(' ');
            if (!date || !time) return 0; // Evitar errores si el formato es inesperado
            // Asegurar el formato YYYY-MM-DD para una correcta interpretación de la fecha
            const [d, m, y] = date.split('/'); 
            if (!d || !m || !y) return 0; // Evitar errores
            return new Date(`${y}-${m}-${d}T${time}`);
        };

        pedidosFiltrados.sort((a, b) => {
            let valA, valB;
            
            if (currentSortField === 'fecha') {
                valA = parseDate(a.fecha).getTime();
                valB = parseDate(b.fecha).getTime();
            } else if (currentSortField === 'estado') {
                // Mapa de prioridades
                const priorities = {
                    "creando diseño": 1,
                    "revisión del cliente": 2, "revision del cliente": 2,
                    "listo para sublimar": 3, "listo para estampar": 3,
                    "producto terminado": 4,
                    "desconocido": 5 // Añadir un valor por defecto para estados no mapeados
                };
                const getPriority = (status) => priorities[(status || 'desconocido').toLowerCase()];
                
                const priorityA = getPriority(a.estado);
                const priorityB = getPriority(b.estado);

                if (priorityA !== priorityB) {
                    return isSortAscending ? (priorityA - priorityB) : (priorityB - priorityA);
                }
                // Si los estados son iguales, ordenar por fecha (más antiguo al más reciente)
                const dateA = parseDate(a.fecha).getTime();
                const dateB = parseDate(b.fecha).getTime();
                return dateA - dateB; // Siempre ascendente para la fecha secundaria
            } else if (currentSortField === 'telefono') {
                valA = parseInt(a.telefono || a.teléfono || 0);
                valB = parseInt(b.telefono || b.teléfono || 0);
            }

            if (valA < valB) return isSortAscending ? -1 : 1;
            if (valA > valB) return isSortAscending ? 1 : -1;
            return 0; 
        });
    }

        // Redirigir a la página de edición, pasando la URL de la imagen como identificador único
        isInternalNavigation = true; // Marcar como navegación interna segura
        window.location.href = `editar_pedido.html?pedido=${encodeURIComponent(pedido.imagen_url)}`;
    }

    function filtrarBusqueda() {
        const query = document.getElementById('searchInput').value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        
        const activeCategoryBtn = document.querySelector('.btn-filter.active');
        const categoriaPlural = activeCategoryBtn ? activeCategoryBtn.innerText.toLowerCase() : 'todos';
        
        let baseList = todosLosPedidos;
        if (categoriaPlural !== 'todos') {
            // Convierte el texto del botón (ej: "Mugs") a la palabra clave de búsqueda (ej: "mug")
            const categoriaSingular = categoriaPlural.endsWith('s') ? categoriaPlural.slice(0, -1) : categoriaPlural;
            baseList = todosLosPedidos.filter(p => p.producto.toLowerCase().includes(categoriaSingular));
        }

        const resultados = baseList.filter(p => {
            const id = (p.s_n || '').toString();
            const tel = (p.telefono || p.teléfono || '').toString();
            const estado = (p.estado || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            
            // Lógica de fecha flexible (Convierte "20/01/2026" a texto buscable con meses)
            const fechaOriginal = (p.fecha || '').toLowerCase();
            let fechaTexto = fechaOriginal;
            const parts = fechaOriginal.split(' ')[0].split('/'); // [DD, MM, YYYY]
            if (parts.length >= 2) {
                const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
                const mesIdx = parseInt(parts[1]) - 1;
                if (mesIdx >= 0) fechaTexto += ` ${meses[mesIdx]}`; // Agrega nombre del mes para buscar
            }

            return id.includes(query) || tel.includes(query) || estado.includes(query) || fechaTexto.includes(query);
        });
        
        // Actualizamos la variable global para que toggleEditMode funcione sobre estos resultados
        pedidosFiltrados = resultados;
        aplicarOrdenamiento(); // Re-ordenar los resultados filtrados
        renderGallery(resultados);
    }

    async function marcarComoTerminado(pedido) {
        const loader = document.getElementById('global-loader');
        loader.style.display = 'flex';
        loader.style.opacity = '1';

        const BACKEND_URL = window.location.hostname.includes('github.io') 
            ? 'https://sublimacion-mary.onrender.com' 
            : '';

        try {
            const res = await fetch(`${BACKEND_URL}/api/update-status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    imagen_url: pedido.imagen_url, 
                    nuevo_estado: 'Producto terminado' 
                })
            });
            const data = await res.json();
            if (data.success) {
                const indexGlobal = todosLosPedidos.findIndex(p => p.s_n === pedido.s_n);
                if (indexGlobal > -1) todosLosPedidos[indexGlobal].estado = 'Producto terminado';
                
                // 1. SALIR DEL MODO TERMINADO INMEDIATAMENTE (Selección única)
                toggleFinishMode(); 

                // 2. Redirigir a WhatsApp con mensaje e imagen inteligente
                const telefono = (pedido.telefono || pedido.teléfono || '').replace(/\D/g, '');
                
                if (telefono) {
                    const sn = pedido.s_n || 'N/A';
                    let imgUrl = pedido.imagen_url; // Por defecto para Mugs, Gorras o si no hay más info
                    
                    // Lógica para Textiles (Saco, Camiseta): Preferir frontal, sino espaldar, sino mantener la que hay
                    const prodLower = (pedido.producto || '').toLowerCase();
                    if (prodLower.includes('camiseta') || prodLower.includes('saco')) {
                        if (pedido.imagenes) {
                            if (pedido.imagenes.frontal) {
                                imgUrl = pedido.imagenes.frontal;
                            } else if (pedido.imagenes.espaldar || pedido.imagenes.trasera) {
                                imgUrl = pedido.imagenes.espaldar || pedido.imagenes.trasera;
                            }
                        }
                    }

                    // Usamos la URL pública de producción para asegurar que el cliente pueda abrir el link
                    // aunque nosotros estemos trabajando en localhost.
                    const publicServerUrl = 'https://sublimacion-mary.onrender.com';
                    const previewUrl = `${publicServerUrl}/api/preview?img=${encodeURIComponent(imgUrl)}&sn=${sn}`;

                    // Usamos códigos Unicode para los emojis para evitar errores de codificación (rombos)
                    // 👋 = \uD83D\uDC4B | ✅ = \u2705 | 🛍️ = \uD83D\uDECD\uFE0F | 👇 = \uD83D\uDC47
                    const mensaje = `\uD83D\uDC4B ¡Hola! Un saludo de *Sublimación Mary*.\n\n\u2705 Tu pedido con S/N: *${sn}* ya está *LISTO* y fabricado.\n\n\uD83D\uDECD\uFE0F Ya puedes pasar a recogerlo.\n\n\uD83D\uDC47 Mira la foto aquí:\n${previewUrl}`;
                    const numeroWhatsApp = telefono.length === 10 ? `+57${telefono}` : telefono;
                    
                    window.location.href = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
                } else {
                    alert('Pedido marcado como terminado, pero no tiene número para redirigir a WhatsApp.');
                }
            } else {
                alert('Error al actualizar el estado: ' + (data.message || 'Error desconocido'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión al actualizar el estado.');
        } finally {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }
    }

    function init3DMug(pedido, container) {
        const imageUrl = pedido.imagen_url;
        const width = window.innerWidth;
        const height = window.innerHeight;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb3b3b3);

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 11); // Alejar cámara para que ocupe aprox 70% del alto

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimización Android
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        // Crear Mug
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        
        // Determinar color del Mug
        const tipo = pedido.tipo_mug || 'clasico';
        const colorName = (pedido.color_mug || '').toLowerCase();
        let mugColor = 0xffffff;

        if (tipo === 'color interno') {
            const colorMap = {
                'rosado': 0xFF69B4,   
                'verde': 0x00CC00,    
                'rojo': 0xFF0000,     
                'amarillo': 0xFFD700, 
                'negro': 0x1a1a1a,    
                'naranja': 0xFF8000   
            };
            if (colorMap[colorName]) mugColor = colorMap[colorName];
        }

        loader.load(imageUrl, (texture) => {
            const img = texture.image;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const widthCoverage = 0.75289575289;
            const heightCoverage = 0.79797979798;

            const canvasWidth = img.width / widthCoverage;
            const canvasHeight = img.height / heightCoverage;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            ctx.fillStyle = 'rgb(255, 255, 255)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            const offsetX = (canvasWidth - img.width) / 2;
            const offsetY = (canvasHeight - img.height) / 2;
            ctx.drawImage(img, offsetX, offsetY, img.width, img.height);

            const newTexture = new THREE.CanvasTexture(canvas);
            newTexture.colorSpace = THREE.SRGBColorSpace;

            // Propiedades para efecto cerámica/porcelana (Esmaltado realista)
            const ceramicProps = {
                roughness: 0.15,       // Superficie lisa
                metalness: 0.1,        // Un toque ligero para reflejos
                clearcoat: 1.0,        // Capa de barniz/esmalte al máximo
                clearcoatRoughness: 0.1 // El barniz es muy liso
            };

            const whiteMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, ...ceramicProps });
            const coloredMat = new THREE.MeshPhysicalMaterial({ color: mugColor, ...ceramicProps });

            // 1. Cilindro Exterior (Imagen)
            const outerGeo = new THREE.CylinderGeometry(2.5, 2.5, 6, 64, 1, true);
            const outerMat = new THREE.MeshPhysicalMaterial({ map: newTexture, ...ceramicProps });
            const outerCyl = new THREE.Mesh(outerGeo, outerMat);
            outerCyl.rotation.y = Math.PI / 2;
            scene.add(outerCyl);

            // 2. Cilindro Interior (Hueco)
            const innerGeo = new THREE.CylinderGeometry(2.3, 2.3, 5.8, 64, 1, true);
            const innerMat = new THREE.MeshPhysicalMaterial({ color: mugColor, side: THREE.BackSide, ...ceramicProps });
            const innerCyl = new THREE.Mesh(innerGeo, innerMat);
            innerCyl.position.y = 0.1;
            scene.add(innerCyl);

            // 3. Borde Superior (Rim)
            const rimGeo = new THREE.RingGeometry(2.3, 2.5, 64);
            const rimMesh = new THREE.Mesh(rimGeo, coloredMat);
            rimMesh.rotation.x = -Math.PI / 2;
            rimMesh.position.y = 3;
            scene.add(rimMesh);
            
            // 4. Fondo Interior
            const innerBottomGeo = new THREE.CircleGeometry(2.3, 64);
            const innerBottomMesh = new THREE.Mesh(innerBottomGeo, coloredMat);
            innerBottomMesh.rotation.x = -Math.PI / 2;
            innerBottomMesh.position.y = -2.8;
            scene.add(innerBottomMesh);

            // 5. Fondo Exterior
            const bottomGeo = new THREE.CircleGeometry(2.5, 64);
            const bottomMesh = new THREE.Mesh(bottomGeo, whiteMat);
            bottomMesh.rotation.x = Math.PI / 2;
            bottomMesh.position.y = -3;
            scene.add(bottomMesh);
        });

        const handleGeom = new THREE.TorusGeometry(2.0, 0.3, 16, 100, Math.PI);
        const handleMat = new THREE.MeshPhysicalMaterial({ 
            color: mugColor,
            roughness: 0.15,
            metalness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });
        const handle = new THREE.Mesh(handleGeom, handleMat);
        handle.position.set(2.4, 0, 0); 
        handle.rotation.z = -Math.PI / 2;
        scene.add(handle);

        const animate = function () {
            animationId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        };
        animate();
    }

        scene.add(fillLight);

        const animate = function () {
            animationId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        };
        animate();

        const loadImage = (src) => new Promise((resolve) => {
            if (!src) return resolve(null);
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = src.startsWith('data:') ? src : (src + (src.includes('?') ? '&' : '?') + 't=' + new Date().getTime());
            img.onload = () => resolve(img);
            img.onerror = () => { console.error("Error cargando imagen:", src); resolve(null); };
        });

        let tshirtFrontImg, tshirtBackImg;

        if (tipoProducto === 'gorra') {
            // Para las gorras, cargamos los logos de la empresa para la camiseta del maniquí
            [tshirtFrontImg, tshirtBackImg] = await Promise.all([
                loadImage('img/logo_sin_fondo.png'),
                loadImage('img/logo_con_fondo.png')
            ]);
        } else {
            // Para otros productos (camisetas, sacos), usamos las imágenes del pedido
            [tshirtFrontImg, tshirtBackImg] = await Promise.all([
                loadImage(urls.frontal),
                loadImage(urls.espaldar)
            ]);
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const size = 1024;
        canvas.width = size;
        canvas.height = size;

        ctx.fillStyle = 'rgb(255, 255, 255)';
        ctx.fillRect(0, 0, size, size);

        // Configuración separada por género y producto (Igual que en mis_pedidos.html)
        const textureSettings = {
            hombre: {
                camiseta: {
                    frontal: { x: -240, y: 200, scale: 1.5, angle: 0 },
                    espaldar: { x: 270, y: 200, scale: 1.5, angle: 0 }
                },
                saco: {
                    frontal: { x: 40, y: 260, scale: 1.0, angle: 0 },
                    espaldar: { x: -320, y: 260, scale: 1.0, angle: 0 }
                },
                gorra: {
                    frontal: { 
                        // Configuración para gorra hombre
                        x: 0, y: 100, scale: 5.5, angle: 0, flipX: true, inclination: -0.2 // Trapecio con puntas más cerradas
                    }
                }
            },
            mujer: {
                camiseta: {
                    frontal: { x: -240, y: 230, scale: 1.5, angle: 0 },
                    espaldar: { x: 270, y: 230, scale: 1.5, angle: 0 }
                },
                saco: {
                    frontal: { x: 40, y: 260, scale: 0.9, angle: 0 },
                    espaldar: { x: -320, y: 260, scale: 0.9, angle: 0 }
                },
                gorra: {
                    frontal: { 
                        // Configuración para gorra mujer
                        x: 0, y: 100, scale: 5.5, angle: 0, flipX: true, inclination: -0.2 // Trapecio con puntas más cerradas
                    }
                }
            }
        };

        // Función para dibujar imagen deformada con 8 puntos (Copiada de mis_pedidos.html)
        const drawWarpedImage = (img, points) => {
            const drawTriangle = (u0, v0, u1, v1, u2, v2, x0, y0, x1, y1, x2, y2) => {
                ctx.save();
                ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath(); ctx.clip();
                const delta = u0 * (v1 - v2) - v0 * (u1 - u2) + (u1 * v2 - u2 * v1);
                const deltaA = x0 * (v1 - v2) - v0 * (x1 - x2) + (x1 * v2 - x2 * v1);
                const deltaB = u0 * (x1 - x2) - x0 * (u1 - u2) + (u1 * x2 - u2 * x1);
                const deltaC = u0 * (v1 * x2 - v2 * x1) - v0 * (u1 * x2 - u2 * x1) + x0 * (u1 * v2 - u2 * v1);
                const deltaD = y0 * (v1 - v2) - v0 * (y1 - y2) + (y1 * v2 - y2 * v1);
                const deltaE = u0 * (y1 - y2) - y0 * (u1 - u2) + (u1 * y2 - u2 * y1);
                const deltaF = u0 * (v1 * y2 - v2 * y1) - v0 * (u1 * y2 - u2 * y1) + y0 * (u1 * v2 - u2 * v1);
                ctx.transform(deltaA / delta, deltaD / delta, deltaB / delta, deltaE / delta, deltaC / delta, deltaF / delta);
                ctx.drawImage(img, 0, 0);
                ctx.restore();
            };
            const w = img.width, h = img.height;
            const s = { tl:{x:0,y:0}, tm:{x:w/2,y:0}, tr:{x:w,y:0}, ml:{x:0,y:h/2}, mm:{x:w/2,y:h/2}, mr:{x:w,y:h/2}, bl:{x:0,y:h}, bm:{x:w/2,y:h}, br:{x:w,y:h} };
            const p = points;
            const c = { x: (p.tm.x + p.bm.x + p.lm.x + p.rm.x) / 4, y: (p.tm.y + p.bm.y + p.lm.y + p.rm.y) / 4 };
            drawTriangle(s.tl.x, s.tl.y, s.tm.x, s.tm.y, s.mm.x, s.mm.y, p.tl.x, p.tl.y, p.tm.x, p.tm.y, c.x, c.y);
            drawTriangle(s.tm.x, s.tm.y, s.tr.x, s.tr.y, s.mm.x, s.mm.y, p.tm.x, p.tm.y, p.tr.x, p.tr.y, c.x, c.y);
            drawTriangle(s.tr.x, s.tr.y, s.mr.x, s.mr.y, s.mm.x, s.mm.y, p.tr.x, p.tr.y, p.rm.x, p.rm.y, c.x, c.y);
            drawTriangle(s.mr.x, s.mr.y, s.br.x, s.br.y, s.mm.x, s.mm.y, p.rm.x, p.rm.y, p.br.x, p.br.y, c.x, c.y);
            drawTriangle(s.br.x, s.br.y, s.bm.x, s.bm.y, s.mm.x, s.mm.y, p.br.x, p.br.y, p.bm.x, p.bm.y, c.x, c.y);
            drawTriangle(s.bm.x, s.bm.y, s.bl.x, s.bl.y, s.mm.x, s.mm.y, p.bm.x, p.bm.y, p.bl.x, p.bl.y, c.x, c.y);
            drawTriangle(s.bl.x, s.bl.y, s.ml.x, s.ml.y, s.mm.x, s.mm.y, p.bl.x, p.bl.y, p.lm.x, p.lm.y, c.x, c.y);
            drawTriangle(s.ml.x, s.ml.y, s.tl.x, s.tl.y, s.mm.x, s.mm.y, p.lm.x, p.lm.y, p.tl.x, p.tl.y, c.x, c.y);
        };

        const drawImageOnCanvas = (img, offsetX, offsetY, scaleFactor, rotationDeg, curvature = 0, warpSettings = null) => {
            // Si hay configuración de deformación (warp), usarla
            if (warpSettings && warpSettings.warp && warpSettings.points) {
                drawWarpedImage(img, warpSettings.points);
                return;
            }

            const maxAllowedWidth = 200 * scaleFactor;
            const maxAllowedHeight = 200 * scaleFactor;

            const scale = Math.min(maxAllowedWidth / img.width, maxAllowedHeight / img.height);
            const drawWidth = img.width * scale;
            const drawHeight = img.height * scale;

            const cx = (size / 2) + offsetX;
            const cy = (size * 0.4) + offsetY;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotationDeg * Math.PI / 180);
            
            // Aplicar espejo horizontal si se requiere
            if (warpSettings && warpSettings.flipX) {
                ctx.scale(-1, 1);
            }

            if (curvature && curvature !== 0) {
                // Dibujar en franjas para simular curvatura (Corrección de arco)
                const slices = 30; 
                const sliceWidth = drawWidth / slices;
                const imgSliceWidth = img.width / slices;
                
                for (let i = 0; i < slices; i++) {
                    // Normalizar x de -1 a 1
                    const nx = (i / (slices - 1)) * 2 - 1; 
                    // Desplazamiento parabólico: y = k * x^2 (Sube los lados)
                    const yShift = curvature * (nx * nx); 
                    
                    // Dibujar franja desplazada
                    ctx.drawImage(img, i * imgSliceWidth, 0, imgSliceWidth, img.height, 
                                 -drawWidth / 2 + i * sliceWidth, -drawHeight / 2 - yShift, sliceWidth + 1.5, drawHeight);
                }
            } else {
                ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            }

            ctx.restore();
        };

        // Función para actualizar la textura según el género actual
        const updateTextureForGender = (gender) => {
            // Limpiar canvas
            ctx.fillStyle = 'rgb(255, 255, 255)';
            ctx.fillRect(0, 0, size, size);

            let settings;
            if (tipoProducto === 'gorra') {
                // Para la gorra, el maniquí usa una camiseta. Usamos la configuración de la camiseta para los logos.
                settings = textureSettings[gender].camiseta;
            } else {
                settings = textureSettings[gender][tipoProducto] || textureSettings[gender].camiseta;
            }

            if (tshirtFrontImg && settings.frontal) {
                const s = settings.frontal;
                drawImageOnCanvas(tshirtFrontImg, s.x, s.y, s.scale, s.angle, s.curvature, s);
            }
            if (tshirtBackImg && settings.espaldar) {
                const s = settings.espaldar;
                drawImageOnCanvas(tshirtBackImg, s.x, s.y, s.scale, s.angle, s.curvature, s);
            }
            if (texture) texture.needsUpdate = true;
        };

        const texture = new THREE.CanvasTexture(canvas);
        texture.flipY = false;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const gltfLoader = new GLTFLoader();
        let currentModel, currentLamina;

        const loadModel = (gender) => {
            if (loaderElement) { loaderElement.style.display = 'flex'; loaderElement.style.opacity = '1'; }

            // Actualizar textura con las coordenadas del género seleccionado
            updateTextureForGender(gender);

            const productType = tipoProducto;
            const modelPath = `modelo_3d/${gender}/modelo_3d_${gender}_${productType}.glb`;

            gltfLoader.load(modelPath, (gltf) => {
                if (currentModel) {
                    scene.remove(currentModel);
                }
                // Remover la lámina anterior si existe para evitar duplicados
                if (currentLamina) {
                    scene.remove(currentLamina);
                    currentLamina = null;
                }
                currentModel = gltf.scene;

                let targetMesh = currentModel;

                currentModel.traverse((child) => {
                    let isTarget = false;
                    // Lógica combinada: se aplica a todos los productos textiles
                    if (tipoProducto === 'gorra') {
                        // Para gorras, buscamos la malla del accesorio de cabeza y la ponemos blanca
                        if (child.isMesh && child.material && (child.material.name.includes('Headwear') || child.material.name.includes('Cap') || child.name.includes('Headwear'))) {
                            child.material.color.setHex(0xffffff);
                            child.material.map = null;
                            child.material.needsUpdate = true;
                        }
                    }
                    // La textura de la camiseta/saco se aplica siempre
                    if (child.isMesh && child.material && (child.material.name === 'Wolf3D_Outfit_Top' || child.material.name.includes('Fabric') || child.material.name.includes('Material'))) isTarget = true;

                    if (isTarget) {
                        const material = child.material;
                        material.map = texture;
                        material.metalness = 0;
                        material.roughness = 1;

                        if (tipoProducto === 'gorra') {
                            material.normalMap = null;
                            material.bumpMap = null;
                        }

                        material.needsUpdate = true;
                        targetMesh = child;
                    }
                });

                scene.add(currentModel);

                // Usar el modelo completo para calcular la caja delimitadora correcta
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = new THREE.Vector3();
                box.getSize(size);
                const center = box.getCenter(new THREE.Vector3());
                
                // Calcular posición del foco (Pecho para ropa, Cabeza para gorras)
                let focusY = box.min.y + (size.y * 0.75); // Por defecto pecho
                if (tipoProducto === 'gorra') {
                    focusY = box.max.y - (size.y * 0.06); // Foco en la cabeza
                    // Hacer zoom en el modelo 3D para gorras
                    camera.zoom = 1.8; // mayor = más cerca
                    camera.updateProjectionMatrix();
                

                    // --- CREAR LÁMINA FLOTANTE PARA LA GORRA ---
                    // Creamos un segmento de cilindro curvo que simula el frente de la gorra
                    const laminaHeight = size.y * 0.037; // Aumentado para que la imagen sea más alta
                    const laminaRadius = size.y * 0.077; // Radio basado en la altura
                    const arcLength = Math.PI / 3.2; // Arco más estrecho para cerrar las puntas superiores

                    // Obtener inclinación de la configuración actual
                    const settings = textureSettings[gender].gorra.frontal;
                    const inclination = settings.inclination || 0;
                    const radiusTop = laminaRadius * (1 - inclination); // Reducir radio superior para inclinar hacia atrás
                    
                    const laminaGeo = new THREE.CylinderGeometry(radiusTop, laminaRadius, laminaHeight, 64, 1, true, -arcLength/2, arcLength);

                    // --- DEFORMACIÓN PARA CREAR PLIEGUE FRONTAL Y CORREGIR ARCO ---
                    const positions = laminaGeo.attributes.position.array;
                    
                    // Definir cuánto sale el pliegue según el género
                    let maxPush;
                    if (gender === 'hombre') {
                        maxPush = laminaRadius * 0.11;
                    } else if (gender === 'mujer') {
                        maxPush = laminaRadius * 0.09;
                    }

                    for (let i = 0; i < positions.length; i += 3) {
                        const x = positions[i];
                        const z = positions[i + 2];

                        // Calcular el ángulo theta para saber qué tan al centro está el punto
                        const theta = Math.atan2(x, z);
                        const factor = Math.cos(theta * (Math.PI / arcLength)); // 1 en el centro, 0 en los bordes

                        // 1. Empujar hacia adelante (eje Z) para crear el pliegue
                        const zOffset = maxPush * factor;
                        positions[i + 2] += zOffset;
                        
                        // 2. Tirar hacia abajo (eje Y) para contrarrestar el arco visual que se forma
                        const yPull = zOffset * 0.5; // Tirar hacia abajo un 50% de lo que se empuja hacia adelante
                        positions[i + 1] -= yPull;
                    }
                    laminaGeo.attributes.position.needsUpdate = true;
                    laminaGeo.computeVertexNormals();

                    // Crear una textura dedicada para la lámina de la gorra para que ocupe el 100%
                    const capTexture = new THREE.TextureLoader().load(urls.frontal, (tex) => {
                        tex.colorSpace = THREE.SRGBColorSpace;
                        tex.center.set(0.5, 0.5);
                        // Este calculo hace que la imagen quede con la base abajo
                        tex.rotation = Math.PI * 2;
                        // Este calculo hace una rotyacion en espejo para que se vea fiel la imagen
                        tex.rotation.x = Math.PI;
                        tex.wrapS = THREE.RepeatWrapping;
                        tex.repeat.x = -1; // Replicar flipX
                    });
                    const laminaMat = new THREE.MeshBasicMaterial({
                        map: capTexture,
                        transparent: true, 
                        alphaTest: 0.5, // Hace transparentes las partes no visibles de la imagen
                        side: THREE.DoubleSide,
                        depthTest: true,
                        depthWrite: true
                    });
                    const laminaMesh = new THREE.Mesh(laminaGeo, laminaMat);

                    // --- Posicionamiento y Rotación por Género ---
                    let laminaRotationX, laminaPositionZOffset;

                    if (gender === 'hombre') {
                        // Inclinar la lámina hacia atrás para que siga la forma de la gorra
                        // Explicacion de posicionamiento, entre menor sea el numero mas se inclina hacia atras
                        laminaRotationX = -0.85;

                        // EXPLICACIÓN DEL POSICIONAMIENTO:
                        // Entre menor sea el número la lamina se mete mas hacia el centro osea dentro del modelo 3D
                        laminaPositionZOffset = -0.037;

                        // EXPLICACION DE POSICIONAMIENTO:
                        // En la seccion (box.max.y - size.y * 0.08) entre mayor sea el número mas hacia abjo se pone la lamina
                        // En la seccion (center.z - 0.045,) entre mayor sea el número de la resta mas hacia adentro se pone la lamina
                        laminaMesh.position.set(center.x, box.max.y - size.y * 0.085, center.z + laminaPositionZOffset);
                    } else if (gender === 'mujer'){
                        // Inclinar la lámina hacia atrás para que siga la forma de la gorra
                        // Explicacion de posicionamiento, entre menor sea el numero mas se inclina hacia atras
                        laminaRotationX = -0.83; // Menos inclinación

                        // EXPLICACIÓN DEL POSICIONAMIENTO:
                        // Entre menor sea el número la lamina se mete mas hacia el centro osea dentro del modelo 3D
                        laminaPositionZOffset = -0.0315; // Más hacia adelante

                        // EXPLICACION DE POSICIONAMIENTO:
                        // En la seccion (box.max.y - size.y * 0.08) entre mayor sea el número mas hacia abjo se pone la lamina
                        // En la seccion (center.z - 0.045,) entre mayor sea el número de la resta mas hacia adentro se pone la lamina
                        laminaMesh.position.set(center.x, box.max.y - size.y * 0.085, center.z + laminaPositionZOffset);
                    }

                    laminaMesh.rotation.x = laminaRotationX;
                    
                    currentLamina = laminaMesh; // Guardar referencia a la lámina actual
                    scene.add(currentLamina);
                }

                controls.target.set(center.x, focusY, center.z);
                // Ajustar cámara: Distancia proporcional a la altura del modelo
                camera.position.set(center.x, focusY, box.max.z + (size.y * (tipoProducto === 'gorra' ? 0.4 : 0.6)));
                controls.update();

                //////////////////////// CAMARA EN TODO EL MODELO 3D ////////////////////////
                // Ajustar foco: Usar centro de la camiseta y bajar ligeramente (10% de su altura) para encuadrar mejor
                //center.y -= size.y * -3.5;

                //controls.target.copy(center);
                // Distancia dinámica: Se adapta si el modelo es grande (cm) o pequeño (m) para llenar la pantalla
                //camera.position.set(center.x, center.y, center.z + (size.y * 10.5));
                //controls.update();

                if (loaderElement) {
                    loaderElement.style.opacity = '0';
                    setTimeout(() => { loaderElement.style.display = 'none'; }, 500);
                }
            }, undefined, (error) => {
                console.error('Error loading 3D model:', error);
                container.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#ccc;text-align:center;padding:20px;">Modelo 3D no disponible.<br>No se pudo cargar el archivo: ${modelPath}</div>`;
                if (loaderElement) { loaderElement.style.opacity = '0'; setTimeout(() => { loaderElement.style.display = 'none'; }, 500); }
            });
        };

        let currentGender = 'hombre';
        loadModel(currentGender);

        const toggleBtn = document.createElement('button');
        const isMobileBtn = window.innerWidth < 768;

        Object.assign(toggleBtn.style, {
            position: 'absolute',
            left: isMobileBtn ? '50%' : '20px',
            top: isMobileBtn ? 'auto' : '50%',
            bottom: isMobileBtn ? '10px' : 'auto',
            transform: isMobileBtn ? 'translateX(-50%)' : 'translateY(-50%)',
            zIndex: '1005',
            padding: '10px 15px',
            borderRadius: '50px',
            color: 'white',
            cursor: 'pointer',
            fontWeight: '600',
            backdropFilter: 'blur(5px)',
            display: 'flex',
            alignItems: 'center',
            gap: '8px',
            transition: 'all 0.3s',
            fontSize: '0.9rem'
        });

        const updateButton = () => {
            if (currentGender === 'hombre') {
                toggleBtn.innerHTML = `Previsualización Dama <span style="font-size:1.2em">♀</span>`;
                toggleBtn.style.background = 'rgba(213, 0, 249, 0.3)';
                toggleBtn.style.border = '2px solid rgb(213, 0, 249)';
                toggleBtn.style.boxShadow = '0 0 15px rgba(213, 0, 249, 0.5)';
            } else {
                toggleBtn.innerHTML = `Previsualización Hombre <span style="font-size:1.2em">♂</span>`;
                toggleBtn.style.background = 'rgba(0, 0, 255, 0.3)';
                toggleBtn.style.border = '2px solid rgb(0, 0, 255)';
                toggleBtn.style.boxShadow = '0 0 15px rgba(0, 0, 255, 0.5)';
            }
        };
        updateButton();

        toggleBtn.onclick = (e) => {
            e.stopPropagation();
            currentGender = currentGender === 'hombre' ? 'mujer' : 'hombre';
            loadModel(currentGender);
            updateButton();
        };
        
        toggleBtn.onmouseover = () => { toggleBtn.style.filter = 'brightness(1.2)'; };
        toggleBtn.onmouseout = () => { toggleBtn.style.filter = 'brightness(1)'; };

        container.appendChild(toggleBtn);
    }

    function cerrarModal() {
        document.getElementById('imageModal').style.display = "none";
        if (animationId) cancelAnimationFrame(animationId);
        if (renderer) {
            renderer.dispose();
            renderer = null;
        }
    }

    // Función para navegar internamente sin cerrar sesión
    function navigateTo(url) {
        isInternalNavigation = true;
        window.location.href = url;
    }

    // Detectar salida de la página para cerrar sesión si no es navegación interna
    window.addEventListener('pagehide', () => {
        if (!isInternalNavigation) {
            // Limpiar credenciales críticas al salir del entorno admin
            sessionStorage.removeItem('adminLogueado');
            sessionStorage.removeItem('adminUsername');
            sessionStorage.removeItem('faceData');
            sessionStorage.removeItem('adminFacialVerified');
            sessionStorage.removeItem('adminLastActivity');
        }
    });

    function cerrarSesion(message) {
        if (message) {
            alert(message);
        }
        sessionStorage.removeItem('adminLogueado');
        sessionStorage.removeItem('adminUsername');
        sessionStorage.removeItem('faceData');
        sessionStorage.removeItem('adminFacialVerified'); // Eliminar token al salir
        sessionStorage.removeItem('adminLastActivity');
        window.location.href = 'index.html';
    }

    // --- Verificación de Baneo en Tiempo Real ---
    function checkBanStatus() {
        const BACKEND_URL = window.location.hostname.includes('github.io') ? 'https://sublimacion-mary.onrender.com' : '';
        fetch(`${BACKEND_URL}/api/heartbeat?t=${Date.now()}`)
            .then(response => {
                // Un código 429 (Too Many Requests) indica un baneo temporal.
                if (response.status === 429) {
                    console.warn("Baneo temporal detectado desde el panel. Cerrando sesión por seguridad.");
                    cerrarSesion("Tu dirección IP ha sido bloqueada temporalmente. Se ha cerrado la sesión.");
                }
            })
            .catch(error => {
                // Un fallo en la red (fetch fallido) indica que el servidor cerró la conexión (baneo permanente).
                console.error("Heartbeat falló desde el panel. Posible baneo permanente. Cerrando sesión.", error);
                cerrarSesion("Tu dirección IP ha sido bloqueada permanentemente. Se ha cerrado la sesión.");
            });
    }
    setInterval(checkBanStatus, 7000); // Verificar cada 7 segundos para ser un poco menos agresivo en el dashboard

    // Exponer funciones al scope global
    window.filtrar = filtrar;
    window.toggleEditMode = toggleEditMode;
    window.toggleFinishMode = toggleFinishMode;
    window.filtrarBusqueda = filtrarBusqueda;
    window.toggleSortDirection = toggleSortDirection;
    window.toggleSortDropdown = toggleSortDropdown;
    window.changeSortField = changeSortField;
    window.cerrarSesion = cerrarSesion;
    window.cerrarModal = cerrarModal;
    window.toggleInfo = toggleInfo;
    window.descargarCarpeta = descargarCarpeta;
    window.navigateTo = navigateTo;
</script>
