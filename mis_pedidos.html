<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mis Pedidos - Sublimación Mary</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

        {
            "imports": {
                "three": "./js/three.module.js"
            }
        }

    <script>
        // SEGURIDAD: Verificar si el cliente inició sesión (pasó por el index)
        if (!sessionStorage.getItem('clienteLogueado')) {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body { 
            font-family: 'Poppins', sans-serif; background-color: #121212; margin: 0; color: white;
            padding: 20px;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }
        .header { text-align: center; margin-bottom: 40px; background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { color: rgb(255, 255, 255); margin: 0 0 10px 0; }
        #infoCliente { color: #b0b0b0; font-size: 0.9rem; }
        
        /* Grid de Imágenes */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
        .gallery-item { border: none; border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s; background: #1e1e1e; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 1px solid #333; }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .gallery-img { width: 100%; height: 160px; object-fit: cover; display: block; }
        .gallery-info { padding: 12px; text-align: center; font-size: 0.85rem; color: #b0b0b0; border-top: 1px solid #333; }
        .gallery-info strong { color: rgb(255, 255, 255); display: block; margin-bottom: 4px; font-size: 0.95rem; }

        /* Modal (Imagen Grande) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { max-width: 90%; max-height: 80%; border-radius: 5px; }
        .close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1001; }
        #container3D { width: 100%; height: 100%; background: #333; display: none; position: absolute; top: 0; left: 0; touch-action: none; }
        
        .back-btn { display: block; width: fit-content; margin: 30px auto; padding: 10px 25px; background: #2d2d2d; color: #b0b0b0; text-decoration: none; border-radius: 50px; position: relative; z-index: 1; font-weight: 500; transition: 0.3s; border: 2px solid #333; }
        .back-btn:hover { background: #333; color: white; transform: translateY(-2px); }

        /* Loader Styles */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #333; z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.5s ease;
        }
        .loader-uib-container {
            --uib-size: 45px;
            --uib-color: white;
            --uib-speed: 2.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: var(--uib-size);
            width: var(--uib-size);
        }
        .slice {
            position: relative;
            height: calc(var(--uib-size) / 6);
            width: 100%;
        }
        .slice::before, .slice::after {
            --uib-a: calc(var(--uib-speed) / -2);
            --uib-b: calc(var(--uib-speed) / -6);
            content: '';
            position: absolute;
            top: 0;
            left: calc(50% - var(--uib-size) / 12);
            height: 100%;
            width: calc(100% / 6);
            border-radius: 50%;
            background-color: var(--uib-color);
            flex-shrink: 0;
            animation: orbit var(--uib-speed) linear infinite;
            transition: background-color 0.3s ease;
        }
        .slice:nth-child(1)::after { animation-delay: var(--uib-a); }
        .slice:nth-child(2)::before { animation-delay: var(--uib-b); }
        .slice:nth-child(2)::after { animation-delay: calc(var(--uib-a) + var(--uib-b)); }
        .slice:nth-child(3)::before { animation-delay: calc(var(--uib-b) * 2); }
        .slice:nth-child(3)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 2); }
        .slice:nth-child(4)::before { animation-delay: calc(var(--uib-b) * 3); }
        .slice:nth-child(4)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 3); }
        .slice:nth-child(5)::before { animation-delay: calc(var(--uib-b) * 4); }
        .slice:nth-child(5)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 4); }
        .slice:nth-child(6)::before { animation-delay: calc(var(--uib-b) * 5); }
        .slice:nth-child(6)::after { animation-delay: calc(var(--uib-a) + var(--uib-b) * 5); }
        @keyframes orbit {
            0% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
            5% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.684208); opacity: 0.58; }
            10% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.631576); opacity: 0.51; }
            15% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.578944); opacity: 0.44; }
            20% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.526312); opacity: 0.37; }
            25% { transform: translateX(0%) scale(0.47368); opacity: 0.3; }
            30% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.526312); opacity: 0.37; }
            35% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.578944); opacity: 0.44; }
            40% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.631576); opacity: 0.51; }
            45% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.684208); opacity: 0.58; }
            50% { transform: translateX(calc(var(--uib-size) * -0.25)) scale(0.73684); opacity: 0.65; }
            55% { transform: translateX(calc(var(--uib-size) * -0.235)) scale(0.789472); opacity: 0.72; }
            60% { transform: translateX(calc(var(--uib-size) * -0.182)) scale(0.842104); opacity: 0.79; }
            65% { transform: translateX(calc(var(--uib-size) * -0.129)) scale(0.894736); opacity: 0.86; }
            70% { transform: translateX(calc(var(--uib-size) * -0.076)) scale(0.947368); opacity: 0.93; }
            75% { transform: translateX(0%) scale(1); opacity: 1; }
            80% { transform: translateX(calc(var(--uib-size) * 0.076)) scale(0.947368); opacity: 0.93; }
            85% { transform: translateX(calc(var(--uib-size) * 0.129)) scale(0.894736); opacity: 0.86; }
            90% { transform: translateX(calc(var(--uib-size) * 0.182)) scale(0.842104); opacity: 0.79; }
            95% { transform: translateX(calc(var(--uib-size) * 0.235)) scale(0.789472); opacity: 0.72; }
            100% { transform: translateX(calc(var(--uib-size) * 0.25)) scale(0.73684); opacity: 0.65; }
        }
        /* Background Logo */
        #background-logo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
            background-image: url('https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png');
            background-position: center; background-repeat: no-repeat;
            opacity: 0.1;
        }

        /* Feedback Overlay */
        .feedback-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Negro translúcido */
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            pointer-events: none; /* Permite clicks al modelo 3D de fondo */
            z-index: 1002;
            padding: 10px 0; box-sizing: border-box;
        }
        .feedback-top-text {
            margin-top: 0px; color: white; font-size: 1.3rem; text-align: center;
            pointer-events: auto; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,0.8); font-weight: bold;
        }
        .feedback-buttons {
            margin-bottom: 30px; display: flex; gap: 40px;
            pointer-events: auto;
        }
        .feedback-btn-wrapper {
            display: flex; flex-direction: column; align-items: center;
        }
        .feedback-label {
            color: white; margin-bottom: 10px; font-size: 1rem; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,0.8); font-weight: 600; letter-spacing: 0.5px;
        }
        .feedback-btn {
            width: 120px; height: 70px; border-radius: 50px; border: none; color: white; font-size: 2.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .feedback-btn:hover { transform: scale(1.15); }
        .feedback-btn:active { transform: scale(0.95); }
        .btn-red { background: linear-gradient(135deg, #ff7675, #d63031); }
        .btn-green { background: linear-gradient(135deg, #55efc4, #00b894); }

        .feedback-form {
            pointer-events: auto; 
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 20px;
            display: flex; 
            flex-direction: column; 
            width: 90%; 
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            position: absolute; 
            top: 50%; 
            right: 20px; 
            left: auto;
            transform: translateY(-50%);
            z-index: 1003;
        }
        .feedback-form textarea {
            width: 100%; 
            height: 120px; 
            margin-bottom: 15px; 
            padding: 15px; 
            box-sizing: border-box;
            border: 2px solid #333; 
            border-radius: 12px; 
            resize: none; 
            font-family: 'Poppins', sans-serif;
            background: #2d2d2d;
            color: white;
            font-size: 0.95rem;
        }
        .feedback-form textarea:focus {
            outline: none;
            border-color: #9b59b6;
        }

        /* Estilos para estado vacío (Sin pedidos) */
        .empty-state-container {
            text-align: center;
            padding: -50px 0px 20px;
            border-radius: 20px;
            margin: 0px auto;
            max-width: 1000px;
            animation: fadeIn 0.8s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .empty-title {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
            font-family:Georgia, 'Times New Roman', Times, serif;
        }
        .empty-title span {
            background:  rgb(213, 0, 249);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 7px rgba(212, 0, 249, 0.8));
        }
        .empty-text {
            font-size: 1.15rem;
            color: #d5d5d5;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .pulse-container {
            animation: pulseZoom 2s infinite ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .highlight-question {
            color: rgb(0, 0, 255);
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 15px;
            -webkit-text-stroke: 0.7px white; /* borde blanco */
            /*text-shadow: 0 2px 4px rgb(0, 0, 255);*/
        }
        .btn-whatsapp-empty {
            display: inline-block;
            background: rgb(17, 161, 70);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgb(37, 211, 101);
            transition: all 0.3s ease;
            border: 2px solid white;
        }
        .btn-whatsapp-empty:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 30px rgb(255, 255, 255);
            background: white;
            border-color: rgb(37, 211, 101);
            color: rgb(37, 211, 101);
        }
        
        @keyframes pulseZoom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .whatsapp-link {
            display: flex;
            align-items: center; /* centra verticalmente */
            gap: 8px; /* espacio entre imagen y texto */
        }
        .whatsapp-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .whatsapp-link img {
            display: block;
        }


    </style>
</head>
<body>

<div id="global-loader">
    <div class="loader-uib-container">
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
        <div class="slice"></div>
    </div>
    <h3 style="margin: 20px 20px 0; text-align: center;">Estamos preparando ¡LA MEJOR EXPERIENCIA PARA TI!</h3>
</div>

<div class="header">
    <h2>Mis Diseños</h2>
    <p id="infoCliente">Cargando...</p>
</div>

<div id="gallery" class="gallery"></div>
<div id="mensajeError"></div>

<a href="#" onclick="cerrarSesionCliente()" class="back-btn">Salir</a>

<!-- Modal para ver imagen grande -->
<div id="imageModal" class="modal">
    <span class="close" onclick="cerrarModal()">&times;</span>
    <img class="modal-content" id="imgGrande">
    <div id="rotationMsg" style="display:none; position:absolute; top:60px; width:100%; text-align:center; color:#fff; font-size:1.2rem; font-weight:600; z-index:10; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 4px rgba(0,0,0,0.8); pointer-events:none;">↻ Gira la camiseta, porque tu pedido tiene el estampado en la parte espaldar</div>
    <div id="container3D" onclick="event.stopPropagation()"></div>

    <!-- Overlay de Feedback -->
    <div id="feedbackOverlay" class="feedback-overlay" style="display: none;">
        <div class="feedback-top-text">¿Está bien el producto o desea solicitar un cambio?</div>
        
        <!-- Formulario de cambio (oculto al inicio) -->
        <div id="feedbackForm" class="feedback-form" style="display: none;">
            <textarea id="cambioTexto" placeholder="Describe qué te gustaría modificar..."></textarea>
            <button onclick="enviarSolicitudCambio()" style="background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white; padding: 12px; border: none; border-radius: 50px; margin-bottom: 10px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3);">Enviar solicitud</button>
            <button onclick="cancelarCambio()" style="background: transparent; color: #b0b0b0; padding: 8px; border: 1px solid #333; border-radius: 50px; cursor: pointer;">Cancelar</button>
        </div>

        <div id="feedbackButtons" class="feedback-buttons">
            <div class="feedback-btn-wrapper">
                <span class="feedback-label">Cambiar</span>
                <button class="feedback-btn btn-red" onclick="mostrarFormularioCambio()">X</button>
            </div>
            <div class="feedback-btn-wrapper">
                <span class="feedback-label">Me encanta</span>
                <button class="feedback-btn btn-green" onclick="enviarMeEncanta()">✔</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from './js/OrbitControls.js';
    import { GLTFLoader } from './js/GLTFLoader.js';


    window.addEventListener('load', function() {
        const loader = document.getElementById('global-loader');
        if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        }

        // Lógica del Logo de Fondo
        const bg = document.createElement('div');
        bg.id = 'background-logo';
        document.body.prepend(bg);

        function updateBg() {
            const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || window.innerWidth < 768;
            if (isMobile) {
                if (window.innerHeight > window.innerWidth) {
                    bg.style.backgroundSize = "60vw auto"; // Vertical: 60% del ancho
                } else {
                    bg.style.backgroundSize = "auto 60vh"; // Horizontal: 60% del alto
                }
            } else {
                bg.style.backgroundSize = "auto 85vh"; // Escritorio: 85% del alto
            }
        }
        updateBg();

        if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) || window.innerWidth < 768) {
            setInterval(updateBg, 1000); // Móvil: Actualizar cada segundo
        } else {
            window.addEventListener('resize', updateBg); // Escritorio: Solo al redimensionar
        }
    });

    // Al cargar la página
    window.onload = function() {
        // Obtener teléfono de la sesión (Fuente de verdad segura)
        const telefono = sessionStorage.getItem('clienteLogueado');
        const galleryDiv = document.getElementById('gallery');

        if (!telefono) {
            document.getElementById('mensajeError').textContent = "No se especificó un número de teléfono.";
            return;
        }

        document.getElementById('infoCliente').textContent = `Pedidos asociados al: ${telefono}`;

        fetch('pedidos.json')
            .then(response => {
                if (!response.ok) throw new Error("No se pudo cargar la base de datos de pedidos.");
                return response.json();
            })
            .then(pedidos => {
                const misPedidos = pedidos.filter(p => (p.telefono || p.teléfono) === telefono);

                if (misPedidos.length > 0) {
                    misPedidos.forEach(pedido => {
                        if (pedido.imagen_url) {
                            const item = document.createElement('div');
                            item.className = 'gallery-item';
                            item.onclick = () => abrirModal(pedido);
                            
                            item.innerHTML = `
                                <img src="${pedido.imagen_url}" class="gallery-img" alt="${pedido.producto}">
                                <div class="gallery-info">
                                    <strong>${pedido.producto}</strong><br>
                                    ${pedido.estado}
                                </div>
                            `;
                            galleryDiv.appendChild(item);
                        }
                    });
                } else {
                    document.getElementById('mensajeError').innerHTML = `
                        <div class="empty-state-container">
                            <div class="empty-title"><span>¡Vaya! No hay nada por aquí</span> 🧐</div>
                            <div class="empty-text">
                                Parece que este número no tiene pedidos registrados aún.
                            </div>
                            <div class="pulse-container">
                                <div class="highlight-question">✨¿Te gustaría personalizar algo único hoy?✨</div>
                                <div class="whatsapp-link">
                                    <a href="https://wa.me/+573209287029?text=Hola,%20quiero%20un%20producto%20de%20sublimacion" target="_blank" class="btn-whatsapp-empty">
                                        🤩 Realizar pedido por WhatsApp <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/3840px-WhatsApp.svg.png" width="40" alt="WhatsApp">
                                    </a>
                                </div>
                            </div>
                        </div>`;
                }
            })
            .catch(err => console.error(err));
    };

    let renderer, scene, camera, controls, animationId;
    let feedbackTimer;
    let currentPedidoData = null;
    let isModelShifted = false;

    function abrirModal(pedido) {
        // Limpiar timer previo incondicionalmente para evitar que salte en pedidos ya aceptados
        if (feedbackTimer) clearTimeout(feedbackTimer);
        isModelShifted = false;

        currentPedidoData = pedido;
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('imgGrande');
        const container3D = document.getElementById('container3D');
        const rotationMsg = document.getElementById('rotationMsg');

        modal.style.display = "flex";
        
        // Limpiar vista anterior
        modalImg.style.display = 'none';
        container3D.style.display = 'none';
        container3D.innerHTML = '';
        rotationMsg.style.display = 'none';

        // Verificar si es un Mug para mostrar en 3D
        if (pedido.producto && pedido.producto.toLowerCase().includes('mug')) {
            container3D.style.display = 'block';
            init3DMug(pedido, container3D);
        } else if (pedido.producto && (pedido.producto.toLowerCase().includes('camiseta') || pedido.producto.toLowerCase().includes('saco') || pedido.producto.toLowerCase().includes('gorra'))) {
            container3D.style.display = 'block';
            
            // Determinar URLs
            let urls = { frontal: null, espaldar: null };
            if (pedido.imagenes) {
                urls = {
                    frontal: pedido.imagenes.frontal ? pedido.imagenes.frontal.trim() : null,
                    espaldar: (pedido.imagenes.espaldar || pedido.imagenes.trasera) ? (pedido.imagenes.espaldar || pedido.imagenes.trasera).trim() : null
                };
            } else {
                if (pedido.imagen_url.includes('frontal')) urls.frontal = pedido.imagen_url;
                else if (pedido.imagen_url.includes('espaldar') || pedido.imagen_url.includes('trasera')) urls.espaldar = pedido.imagen_url;
                else urls.frontal = pedido.imagen_url;
            }
            
            let tipo = 'camiseta';
            if (pedido.producto.toLowerCase().includes('saco')) tipo = 'saco';
            if (pedido.producto.toLowerCase().includes('gorra')) tipo = 'gorra';
            init3DTextil(urls, container3D, tipo);
        } else {
            modalImg.style.display = 'block';
            modalImg.src = pedido.imagen_url;
        }

        // Resetear estado del overlay
        const overlay = document.getElementById('feedbackOverlay');
        overlay.style.display = 'none';
        document.getElementById('feedbackForm').style.display = 'none';
        document.getElementById('feedbackButtons').style.display = 'flex';

        // Iniciar temporizador de 5 segundos
        if (pedido.estado === "Revisión del cliente") {
            feedbackTimer = setTimeout(() => {
                if (modal.style.display !== 'none') {
                    overlay.style.display = 'flex';
                }
            }, 15000);
        }
    }

    function init3DMug(pedido, container) {
        const imageUrl = pedido.imagen_url;
        const width = window.innerWidth;
        const height = window.innerHeight;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb3b3b3);

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 11); // Alejar cámara para que ocupe aprox 70% del alto

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimización Android
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        // Crear Mug
        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        
        // Determinar color del Mug
        const tipo = pedido.tipo_mug || 'clasico';
        const colorName = (pedido.color_mug || '').toLowerCase();
        let mugColor = 0xffffff;

        if (tipo === 'color interno') {
            const colorMap = {
                'rosado': 0xFF69B4,   // HotPink
                'verde': 0x00CC00,    // Green
                'rojo': 0xFF0000,     // Red
                'amarillo': 0xFFD700, // Gold
                'negro': 0x1a1a1a,    // Dark Gray (not pure black for shading)
                'naranja': 0xFF8000   // Orange
            };
            if (colorMap[colorName]) mugColor = colorMap[colorName];
        }

        loader.load(imageUrl, (texture) => {
            // Crear canvas para añadir espacio blanco (gap) alrededor de la oreja
            const img = texture.image;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Definir porcentajes de cobertura (Ancho y Alto)
            const widthCoverage = 0.75289575289;
            const heightCoverage = 0.79797979798;

            const canvasWidth = img.width / widthCoverage;
            const canvasHeight = img.height / heightCoverage;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // Fondo blanco
            ctx.fillStyle = 'rgb(255, 255, 255)';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Dibujar imagen centrada
            const offsetX = (canvasWidth - img.width) / 2;
            const offsetY = (canvasHeight - img.height) / 2;
            ctx.drawImage(img, offsetX, offsetY, img.width, img.height);

            const newTexture = new THREE.CanvasTexture(canvas);
            newTexture.colorSpace = THREE.SRGBColorSpace;

            // Propiedades para efecto cerámica/porcelana (Esmaltado realista)
            const ceramicProps = {
                roughness: 0.15,       // Superficie lisa
                metalness: 0.1,        // Un toque ligero para reflejos
                clearcoat: 1.0,        // Capa de barniz/esmalte al máximo
                clearcoatRoughness: 0.1 // El barniz es muy liso
            };

            const whiteMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, ...ceramicProps });
            const coloredMat = new THREE.MeshPhysicalMaterial({ color: mugColor, ...ceramicProps });

            // 1. Cilindro Exterior (Imagen)
            const outerGeo = new THREE.CylinderGeometry(2.5, 2.5, 6, 64, 1, true);
            const outerMat = new THREE.MeshPhysicalMaterial({ map: newTexture, ...ceramicProps });
            const outerCyl = new THREE.Mesh(outerGeo, outerMat);
            outerCyl.rotation.y = Math.PI / 2; // Alinear costura
            scene.add(outerCyl);

            // 2. Cilindro Interior (Hueco)
            const innerGeo = new THREE.CylinderGeometry(2.3, 2.3, 5.8, 64, 1, true);
            const innerMat = new THREE.MeshPhysicalMaterial({ color: mugColor, side: THREE.BackSide, ...ceramicProps });
            const innerCyl = new THREE.Mesh(innerGeo, innerMat);
            innerCyl.position.y = 0.1; // Subir para alinear con el borde superior
            scene.add(innerCyl);

            // 3. Borde Superior (Rim)
            const rimGeo = new THREE.RingGeometry(2.3, 2.5, 64);
            const rimMesh = new THREE.Mesh(rimGeo, coloredMat);
            rimMesh.rotation.x = -Math.PI / 2;
            rimMesh.position.y = 3;
            scene.add(rimMesh);
            
            // 4. Fondo Interior
            const innerBottomGeo = new THREE.CircleGeometry(2.3, 64);
            const innerBottomMesh = new THREE.Mesh(innerBottomGeo, coloredMat);
            innerBottomMesh.rotation.x = -Math.PI / 2;
            innerBottomMesh.position.y = -2.8;
            scene.add(innerBottomMesh);

            // 5. Fondo Exterior
            const bottomGeo = new THREE.CircleGeometry(2.5, 64);
            const bottomMesh = new THREE.Mesh(bottomGeo, whiteMat);
            bottomMesh.rotation.x = Math.PI / 2;
            bottomMesh.position.y = -3;
            scene.add(bottomMesh);
        });

        // Oreja del Mug
        const handleGeom = new THREE.TorusGeometry(2.0, 0.3, 16, 100, Math.PI);
        const handleMat = new THREE.MeshPhysicalMaterial({ 
            color: mugColor,
            roughness: 0.15,
            metalness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });
        const handle = new THREE.Mesh(handleGeom, handleMat);
        handle.position.set(2.4, 0, 0); // Posicionar al lado (pegado al cuerpo)
        handle.rotation.z = -Math.PI / 2;
        scene.add(handle);

        const animate = function () {
            animationId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        };
        animate();
    }

     async function init3DTextil(urls, container, tipoProducto) {

        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(-5, 5, 5);
        scene.add(fillLight);

        const animate = function () {
            animationId = requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        };
        animate();

        const loadImage = (src) => new Promise((resolve) => {
            if (!src) return resolve(null);
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = src.startsWith('data:') ? src : (src + (src.includes('?') ? '&' : '?') + 't=' + new Date().getTime());
            img.onload = () => resolve(img);
            img.onerror = () => { console.error("Error cargando imagen:", src); resolve(null); };
        });

        const [frontImg, backImg] = await Promise.all([
            loadImage(urls.frontal),
            loadImage(urls.espaldar)
        ]);

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const size = 1024;
        canvas.width = size;
        canvas.height = size;

        ctx.fillStyle = 'rgb(255, 255, 255)';
        ctx.fillRect(0, 0, size, size);

        // Configuración separada por género y producto
        const textureSettings = {
            hombre: {
                //Explicacion de dimensiones en camiseta:
                // X -> Entre mayor sea el número se mueve la lamina hacia la derecha
                // NOTA DE X: Su tope esta en la costura derecha en la parte frontal de la camiseta
                // Y -> Entre mayor sea el número se mueve la lamina hacia abajo
                // SCALE -> Entre mayor sea el número mas grande es la lamina
                // ANGLE -> Entre mayor sea el número se inclina mas la lamina hacia la derecha
                camiseta: {
                    frontal: { x: -240, y: 200, scale: 1.5, angle: 0 },
                    espaldar: { x: 270, y: 200, scale: 1.5, angle: 0 }
                },
                //Explicacion de dimensiones en saco:
                // X -> Entre mayor sea el número se mueve la lamina hacia la derecha
                // NOTA DE X: Su tope esta en la costura izquierda en la parte frontal del saco

                // Y -> Entre mayor sea el número se mueve la lamina hacia abajo
                // SCALE -> Entre mayor sea el número mas grande es la lamina
                // ANGLE -> Entre mayor sea el número se inclina mas la lamina hacia la derecha
                saco: {
                    frontal: { x: 40, y: 260, scale: 1.0, angle: 0 },
                    espaldar: { x: -320, y: 260, scale: 1.0, angle: 0 }
                },
                //Explicacion de dimensiones en gorra:
                // X -> Entre mayor sea el número se mueve la lamina hacia la derecha
                // NOTA DE X: Su tope esta en la costura izquierda en la parte frontal del saco

                // Y -> Entre mayor sea el número se mueve la lamina hacia abajo
                // SCALE -> Entre mayor sea el número mas grande es la lamina
                // ANGLE -> Entre mayor sea el número se inclina mas la lamina hacia la derecha
                gorra: {
                    // Ajuste para la corona de la gorra (encima de la visera)
                    frontal: { x: 230, y: 560, scale: 1.5, angle: 0, curvature: 60 }, 
                }
            },
            mujer: {
                //Explicacion de dimensiones en camiseta:
                // X -> Entre mayor sea el número se mueve la lamina hacia la derecha
                // NOTA DE X: Su tope esta en la costura derecha en la parte frontal de la camiseta
                // Y -> Entre mayor sea el número se mueve la lamina hacia abajo
                // SCALE -> Entre mayor sea el número mas grande es la lamina
                // ANGLE -> Entre mayor sea el número se inclina mas la lamina hacia la derecha
                camiseta: {
                    // Y aumentado para bajar el estampado y que no quede muy pegado al cuello
                    frontal: { x: -240, y: 230, scale: 1.5, angle: 0 },
                    espaldar: { x: 270, y: 230, scale: 1.5, angle: 0 }
                },
                //Explicacion de dimensiones en saco:
                // X -> Entre mayor sea el número se mueve la lamina hacia la derecha
                // NOTA DE X: Su tope esta en la costura izquierda en la parte frontal del saco

                // Y -> Entre mayor sea el número se mueve la lamina hacia abajo
                // SCALE -> Entre mayor sea el número mas grande es la lamina
                // ANGLE -> Entre mayor sea el número se inclina mas la lamina hacia la derecha
                saco: {
                    // SCALE disminuido para que no quede la imagen sobre los bolsillos
                    frontal: { x: 40, y: 260, scale: 0.9, angle: 0 },
                    espaldar: { x: -320, y: 260, scale: 0.9, angle: 0 }
                },
                //Explicacion de dimensiones en gorra:
                // X -> Entre mayor sea el número se mueve la lamina hacia la derecha
                // NOTA DE X: Su tope esta en la costura izquierda en la parte frontal del saco

                // Y -> Entre mayor sea el número se mueve la lamina hacia abajo
                // SCALE -> Entre mayor sea el número mas grande es la lamina
                // ANGLE -> Entre mayor sea el número se inclina mas la lamina hacia la derecha
                gorra: {
                    frontal: { x: 230, y: 560, scale: 1.5, angle: 0, curvature: 0 }, 
                }
            }
        };

        const drawImageOnCanvas = (img, offsetX, offsetY, scaleFactor, rotationDeg, curvature = 0) => {
            const maxAllowedWidth = 200 * scaleFactor;
            const maxAllowedHeight = 200 * scaleFactor;

            const scale = Math.min(maxAllowedWidth / img.width, maxAllowedHeight / img.height);
            const drawWidth = img.width * scale;
            const drawHeight = img.height * scale;

            const cx = (size / 2) + offsetX;
            const cy = (size * 0.4) + offsetY;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotationDeg * Math.PI / 180);

            if (curvature && curvature !== 0) {
                // Dibujar en franjas para simular curvatura (Corrección de arco)
                const slices = 30; // Cantidad de cortes
                const sliceWidth = drawWidth / slices;
                const imgSliceWidth = img.width / slices;
                
                for (let i = 0; i < slices; i++) {
                    // Normalizar x de -1 a 1
                    const nx = (i / (slices - 1)) * 2 - 1; 
                    // Desplazamiento parabólico: y = k * x^2 (Sube los lados)
                    const yShift = curvature * (nx * nx); 
                    
                    // Dibujar franja desplazada
                    // Se agrega +1.5 al ancho destino para evitar líneas blancas entre cortes
                    ctx.drawImage(img, i * imgSliceWidth, 0, imgSliceWidth, img.height, 
                                 -drawWidth / 2 + i * sliceWidth, -drawHeight / 2 - yShift, sliceWidth + 1.5, drawHeight);
                }
            } else {
                ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            }
            ctx.restore();
        };

        // Función para actualizar la textura según el género actual
        const updateTextureForGender = (gender) => {
            // Limpiar canvas
            ctx.fillStyle = 'rgb(255, 255, 255)';
            ctx.fillRect(0, 0, size, size);

            const settings = textureSettings[gender][tipoProducto] || textureSettings[gender].camiseta;

            if (frontImg && settings.frontal) {
                const s = settings.frontal;
                drawImageOnCanvas(frontImg, s.x, s.y, s.scale, s.angle, s.curvature);
            }
            // Solo dibujar espalda si existe configuración (Gorra es null)
            if (backImg && settings.espaldar) {
                const s = settings.espaldar;
                drawImageOnCanvas(backImg, s.x, s.y, s.scale, s.angle, s.curvature);
            }
            if (texture) texture.needsUpdate = true;
        };

        const texture = new THREE.CanvasTexture(canvas);
        texture.flipY = false;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const gltfLoader = new GLTFLoader();
        let currentModel;

        const loadModel = (gender) => {
            if (loaderElement) { loaderElement.style.display = 'flex'; loaderElement.style.opacity = '1'; }

            // Actualizar textura con las coordenadas del género seleccionado
            updateTextureForGender(gender);

            const productType = tipoProducto; // Usar el tipo dinámico (camiseta, saco, gorra)
            const modelPath = `modelo_3d/${gender}/modelo_3d_${gender}_${productType}.glb`;

            gltfLoader.load(modelPath, (gltf) => {
                if (currentModel) {
                    scene.remove(currentModel);
                }
                currentModel = gltf.scene;

                let targetMesh = currentModel;

                currentModel.traverse((child) => {
                    let isTarget = false;
                    if (tipoProducto === 'gorra') {
                        // Para gorras, buscamos la malla del accesorio de cabeza
                        if (child.isMesh && child.material && (child.material.name.includes('Headwear') || child.material.name.includes('Cap') || child.name.includes('Headwear'))) isTarget = true;
                    } else {
                        // Para camisetas y sacos
                        if (child.isMesh && child.material && (child.material.name === 'Wolf3D_Outfit_Top' || child.material.name.includes('Fabric') || child.material.name.includes('Material'))) isTarget = true;
                    }

                    if (isTarget) {
                        const material = child.material;
                        material.map = texture;
                        material.metalness = 0;
                        material.roughness = 1;

                        if (tipoProducto === 'gorra') {
                            material.normalMap = null;
                            material.bumpMap = null;
                        }

                        material.needsUpdate = true;
                        targetMesh = child;
                    }
                });

                scene.add(currentModel);

                // Usar el modelo completo para calcular la caja delimitadora correcta
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = new THREE.Vector3();
                box.getSize(size);
                const center = box.getCenter(new THREE.Vector3());
                
                // Calcular posición del foco (Pecho para ropa, Cabeza para gorras)
                let focusY = box.min.y + (size.y * 0.75); // Por defecto pecho
                if (tipoProducto === 'gorra') {
                    focusY = box.max.y - (size.y * 0.1); // Foco en la cabeza
                }

                controls.target.set(center.x, focusY, center.z);
                // Ajustar cámara: Distancia proporcional a la altura del modelo
                camera.position.set(center.x, focusY, box.max.z + (size.y * (tipoProducto === 'gorra' ? 0.4 : 0.6)));
                controls.update();

                //////////////////////// CAMARA EN TODO EL MODELO 3D ////////////////////////
                // Ajustar foco: Usar centro de la camiseta y bajar ligeramente (10% de su altura) para encuadrar mejor
                //center.y -= size.y * -3.5;

                //controls.target.copy(center);
                // Distancia dinámica: Se adapta si el modelo es grande (cm) o pequeño (m) para llenar la pantalla
                //camera.position.set(center.x, center.y, center.z + (size.y * 10.5));
                //controls.update();

                if (loaderElement) {
                    loaderElement.style.opacity = '0';
                    setTimeout(() => { loaderElement.style.display = 'none'; }, 500);
                }
            }, undefined, (error) => {
                console.error('Error loading 3D model:', error);
                container.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#ccc;text-align:center;padding:20px;">Modelo 3D no disponible.<br>No se pudo cargar el archivo: ${modelPath}</div>`;
                if (loaderElement) { loaderElement.style.opacity = '0'; setTimeout(() => { loaderElement.style.display = 'none'; }, 500); }
            });
        };

        let currentGender = 'hombre';
        loadModel(currentGender);

        const toggleBtn = document.createElement('button');
        toggleBtn.id = 'genderToggleBtn';
        Object.assign(toggleBtn.style, {
            position: 'absolute',
            left: '20px',
            top: '50%',
            transform: 'translateY(-50%)',
            zIndex: '1005',
            padding: '10px 15px',
            borderRadius: '50px',
            color: 'white',
            cursor: 'pointer',
            fontWeight: '600',
            backdropFilter: 'blur(5px)',
            display: 'flex',
            alignItems: 'center',
            gap: '8px',
            transition: 'all 0.3s',
            fontSize: '0.9rem'
        });

        const updateButton = () => {
            if (currentGender === 'hombre') {
                toggleBtn.innerHTML = `Previsualización Dama <span style="font-size:1.2em">♀</span>`;
                toggleBtn.style.background = 'rgba(213, 0, 249, 0.3)';
                toggleBtn.style.border = '2px solid rgb(213, 0, 249)';
                toggleBtn.style.boxShadow = '0 0 15px rgba(213, 0, 249, 0.5)';
            } else {
                toggleBtn.innerHTML = `Previsualización Hombre <span style="font-size:1.2em">♂</span>`;
                toggleBtn.style.background = 'rgba(0, 0, 255, 0.3)';
                toggleBtn.style.border = '2px solid rgb(0, 0, 255)';
                toggleBtn.style.boxShadow = '0 0 15px rgba(0, 0, 255, 0.5)';
            }
        };
        updateButton();

        toggleBtn.onclick = (e) => {
            e.stopPropagation();
            currentGender = currentGender === 'hombre' ? 'mujer' : 'hombre';
            // loadModel llama internamente a updateTextureForGender
            loadModel(currentGender);
            updateButton();
        };

        toggleBtn.onmouseover = () => { toggleBtn.style.filter = 'brightness(1.2)'; };
        toggleBtn.onmouseout = () => { toggleBtn.style.filter = 'brightness(1)'; };

        container.appendChild(toggleBtn);
    }

    function animateCameraShift(offset) {
        if (!controls || !camera) return;
        const startX = controls.target.x;
        const endX = startX + offset;
        const camStartX = camera.position.x;
        const camEndX = camStartX + offset;
        const duration = 500;
        const startTime = Date.now();
        function update() {
            const now = Date.now();
            const progress = Math.min((now - startTime) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            controls.target.x = startX + (endX - startX) * ease;
            camera.position.x = camStartX + (camEndX - camStartX) * ease;
            controls.update();
            if (progress < 1) requestAnimationFrame(update);
        }
        update();
    }

        if (!textoCambio) {
            alert("Por favor describe el cambio que deseas.");
            return;
        }

        const telefono = currentPedidoData.telefono || currentPedidoData.teléfono;
        const imgUrl = currentPedidoData.imagen_url;
        const linkPagina = window.location.href;

        // Actualizar estado localmente y ocultar overlay inmediatamente
        currentPedidoData.estado = "Creando diseño";
        document.getElementById('feedbackOverlay').style.display = 'none';

        // Actualizar estado en servidor
        const BACKEND_URL = window.location.hostname.includes('github.io') 
            ? 'https://sublimacion-mary.onrender.com' 
            : '';

        fetch(`${BACKEND_URL}/api/update-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imagen_url: imgUrl, nuevo_estado: "Creando diseño", detalles: textoCambio })
        });

        // La notificación por correo ahora se envía automáticamente desde el backend (server.js)
        // al llamar a /api/update-status. No se necesita hacer nada más aquí.

        // Copiar al portapapeles
        navigator.clipboard.writeText(textoCambio).then(() => {
            // Redireccionar a WhatsApp
            const mensajeWA = `Hola, soy el cliente ${telefono} y vengo del link ${linkPagina} pero quiero solicitar una modificación en el producto con la imagen ${imgUrl}, deseo que: ${textoCambio}`;
            const urlWA = `https://wa.me/+573209287029?text=${encodeURIComponent(mensajeWA)}`;
            
            window.location.href = urlWA;
        }).catch(err => {
            console.error('Error al copiar: ', err);
            // Fallback si falla el copiado, redireccionar igual
            const mensajeWA = `Hola, soy el cliente ${telefono} y vengo del link ${linkPagina} pero quiero solicitar una modificación en el producto con la imagen ${imgUrl}, deseo que: ${textoCambio}`;
            window.location.href = `https://wa.me/+573209287029?text=${encodeURIComponent(mensajeWA)}`;
        });
    }

    function cerrarSesionCliente() {
        sessionStorage.removeItem('clienteLogueado');
        window.location.href = 'index.html';
    }

    // Exponer funciones al scope global para los `onclick` del HTML
    window.cerrarSesionCliente = cerrarSesionCliente;
    window.abrirModal = abrirModal;
    window.cerrarModal = cerrarModal;
    window.mostrarFormularioCambio = mostrarFormularioCambio;
    window.cancelarCambio = cancelarCambio;
    window.enviarMeEncanta = enviarMeEncanta;
    window.enviarSolicitudCambio = enviarSolicitudCambio;
</script>

</body>
</html>
