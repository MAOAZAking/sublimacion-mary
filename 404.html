<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Sublimación Mary</title>
    <link rel="icon" href="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <script src="js/global.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; color: white; text-align: center; }
        .container {padding: 3rem 2rem; border-radius: 24px; width: 100%; max-width: 380px; text-align: center; transition: transform 0.3s ease; position: relative; z-index: 1; }
        /*.container:hover { transform: translateY(-8px); }*/
        .footer-copy { position: absolute; bottom: 20px; }
        .logo { width: 110px; filter: drop-shadow(0 0 15px rgba(213, 0, 249, 0.4)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .error-code-container { display: flex; align-items: center; justify-content: center; margin: 0 0; }
        .error-img { height: 120px; width: auto; filter: drop-shadow(0 0 15px rgba(213, 0, 249, 0.3)); margin: 0 -18px; position: relative; }
        .error-img-zero { height: 155px; position: relative; z-index: 2; filter: drop-shadow(0 0 20px rgba(213, 0, 249, 0.5)); }
        .mirrored { transform: scaleX(-1); margin-left: -15px; } /* Ajustado para dar más espacio entre el 0 y este 4 */
        h2 { filter: drop-shadow(0 0 7px rgb(212, 0, 249)); color: #fff; margin: 10px 0 15px; font-weight: 600; font-size: 1.6rem; letter-spacing: -0.5px; }
        p { filter: drop-shadow(0 0 4px rgb(212, 0, 249)); color: #aaa; margin-bottom: 25px; font-size: 1rem; line-height: 1.6; padding: 0 10px; }
        .btn { display: block; padding: 16px; background: linear-gradient(135deg, rgb(213, 0, 249), rgb(192, 0, 224)); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s; box-shadow: 0 10px 25px rgba(142, 68, 173, 0.4); }
        .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 35px rgba(192, 0, 224, 0.5); color: white; }
        .btn:active { transform: translateY(0) scale(1); }
        
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/logo_sin_fondo.png" alt="Logo" class="logo">
        <div class="error-code-container">
            <img src="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/404/4_derecho.png" class="error-img" alt="4">
            <img src="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/404/0.png" class="error-img error-img-zero" alt="0">
            <img src="https://raw.githubusercontent.com/MAOAZAking/sublimacion-mary/main/img/404/4_derecho.png" class="error-img mirrored" alt="4" > 
        </div>
        <h2>¡Ups! Te has perdido</h2>
        <p>Parece que el diseño que buscas no está en nuestra estantería o el enlace ha caducado.</p>
        <a href="#" class="btn" onclick="
            event.preventDefault();
            location.href = location.hostname.includes('github.io')
                ? '/' + location.pathname.split('/')[1] + '/'
                : '/';
        ">
            Volver al Inicio
        </a>
    </div>

    <div id="background-logo"></div>

    <div class="footer-copy">
        &copy; <span id="copyright-year"></span> Sublimación Mary. Todo personalizado.
    </div>

</body>
</html>
